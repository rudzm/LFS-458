apiVersion: apps/v1
kind: Deployment
metadata:
  name: witryna
spec:
  replicas: 2
  selector:
    matchLabels: {app: witryna}
  template:
    metadata:
      labels: {app: witryna}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]

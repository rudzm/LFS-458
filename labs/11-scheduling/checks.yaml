module: "11"
title: "Scheduling — sterowanie rozmieszczeniem Podów"
chapter: 11
chapterTitle: "Scheduling"
day: 3
environment: kind-basic

intro: |
  Pięć mechanizmów decydujących o tym, gdzie wyląduje Pod. Każdy daje efekt
  widoczny natychmiast — trzymaj pod ręką:

  ```bash
  kubectl get pods -n lfs458-m11 -o wide
  ```

  > **Zadanie 2 celowo tworzy Pod, który zostaje w `Pending`.** To nie awaria,
  > tylko materiał do diagnozy.

cleanup:
  - name: "Usuwam arkusz odpowiedzi"
    timeout: 30s
    ignoreError: true
    script: |
      rm -f "${ODPOWIEDZI:-$HOME/odpowiedzi}/lab-11.txt"
      echo "arkusz usunięty"
  - name: "Usuwam namespace lfs458-m11"
    timeout: 3m
    script: |
      kubectl --context "${KUBECONTEXT:-kind-lfs458}" delete namespace lfs458-m11 --ignore-not-found --wait=true
  - name: "Usuwam namespace quizu i PriorityClass"
    timeout: 3m
    ignoreError: true
    script: |
      K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
      $K delete namespace lfs458-m11-quiz --ignore-not-found --wait=true
      $K delete priorityclass lfs458-wazne --ignore-not-found
  - name: "Zdejmuję etykiety i taints z node'ów"
    timeout: 2m
    ignoreError: true
    script: |
      K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
      $K label node lfs458-worker2 dysk- 2>/dev/null || true
      $K taint node lfs458-worker2 gpu:NoSchedule- 2>/dev/null || true
      echo "node'y przywrócone do stanu wyjściowego"
      $K get nodes -o custom-columns=WEZEL:.metadata.name,TAINTS:.spec.taints --no-headers

tasks:
  - id: task-1
    points: 3
    description: |
      **Przypnij Pod do konkretnego node'a.**

      1. Nadaj node'owi **`lfs458-worker2`** etykietę **`dysk=ssd`**
      2. W namespace `lfs458-m11` uruchom Pod **`na-ssd`**
         (`nginx:1.27-alpine`) z `nodeSelector`, który wymusi trafienie
         właśnie na ten node

      ```bash
      kubectl get nodes --show-labels
      kubectl get pod na-ssd -n lfs458-m11 -o wide
      ```
    hints:
      - "Etykietę node'owi nadaje się tak samo jak Podowi: `kubectl label node <node> klucz=wartość`."
      - "`nodeSelector` to mapa w `spec` Poda, na tym samym poziomie co `containers`."
      - "Nie wpisuj `nodeName` — to omija schedulera. Chodzi o to, żeby scheduler **sam** wybrał ten node, bo pasuje do warunku."
      - "Komplet:\n\n```bash\nkubectl label node lfs458-worker2 dysk=ssd\n```\n\n```yaml\nspec:\n  nodeSelector:\n    dysk: ssd\n  containers:\n    - name: web\n      image: nginx:1.27-alpine\n```"
    solution: |
      ```bash
      kubectl create namespace lfs458-m11
      kubectl label node lfs458-worker2 dysk=ssd --overwrite

      cat <<'EOF' | kubectl apply -f -
      apiVersion: v1
      kind: Pod
      metadata:
        name: na-ssd
        namespace: lfs458-m11
      spec:
        nodeSelector:
          dysk: ssd
        containers:
          - name: web
            image: nginx:1.27-alpine
      EOF

      kubectl get pod na-ssd -n lfs458-m11 -o wide
      ```
    checks:
      - name: "node lfs458-worker2 ma etykietę dysk=ssd"
        resource:
          apiVersion: v1
          kind: Node
          name: lfs458-worker2
        assert:
          - path: "{.metadata.labels['dysk']}"
            op: eq
            value: ssd
      - name: "Pod na-ssd używa nodeSelector, a nie nodeName"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: lfs458-m11
          name: na-ssd
        assert:
          - path: "{.spec.nodeSelector['dysk']}"
            op: eq
            value: ssd
            message: "Pod ma mieć `nodeSelector: {dysk: ssd}` — to scheduler ma wybrać node"
      - name: "Pod wylądował na lfs458-worker2 i działa"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: lfs458-m11
          name: na-ssd
        assert:
          - path: "{.spec.nodeName}"
            op: eq
            value: lfs458-worker2
          - path: "{.status.phase}"
            op: eq
            value: Running

  - id: task-2
    points: 3
    description: |
      **Zobacz, jak wygląda Pod nie do zaplanowania.**

      Utwórz w `lfs458-m11` Pod **`za-duzy`** (`nginx:1.27-alpine`), który
      prosi o **`200Gi` pamięci** w `requests`. Żaden node tego nie ma,
      więc Pod zostanie w `Pending`.

      Przeczytaj zdarzenia i zwróć uwagę, jak konkretny jest komunikat:

      ```bash
      kubectl describe pod za-duzy -n lfs458-m11 | sed -n '/Events/,$p'
      ```

      Potem zapisz odczytany powód w arkuszu **`~/odpowiedzi/lab-11.txt`**
      pod kluczem `powod` — wystarczy fraza z komunikatu schedulera.
    hints:
      - "`resources.requests.memory: 200Gi` w specyfikacji kontenera wystarczy — nie potrzeba `limits`."
      - "Zdarzenie ma `Reason: FailedScheduling`, a w wiadomości pojawia się fraza o niewystarczających zasobach."
      - "Scheduler pisze `Insufficient memory` — właśnie tę frazę wpisz do arkusza."
      - "```bash\ncat >> ~/odpowiedzi/lab-11.txt <<'EOF'\npowod=Insufficient memory\nEOF\n```"
    solution: |
      ```bash
      cat <<'EOF' | kubectl apply -f -
      apiVersion: v1
      kind: Pod
      metadata:
        name: za-duzy
        namespace: lfs458-m11
      spec:
        containers:
          - name: web
            image: nginx:1.27-alpine
            resources:
              requests:
                memory: 200Gi
      EOF

      kubectl describe pod za-duzy -n lfs458-m11 | sed -n '/Events/,$p'

      cat >> ~/odpowiedzi/lab-11.txt <<'EOF'
      powod=Insufficient memory
      EOF
      ```
    checks:
      - name: "Pod za-duzy istnieje i został w stanie Pending"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: lfs458-m11
          name: za-duzy
        assert:
          - path: "{.status.phase}"
            op: eq
            value: Pending
            message: "Pod ma zostać niezaplanowany — jeśli działa, żądanie pamięci było za małe"
          - path: "{.spec.containers[*].resources.requests.memory}"
            op: eq
            value: "200Gi"
      - name: "scheduler jawnie odmówił zaplanowania"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: lfs458-m11
          name: za-duzy
        assert:
          - path: "{.status.conditions[?(@.type=='PodScheduled')].reason}"
            op: eq
            value: Unschedulable
            message: "warunek PodScheduled powinien mieć reason=Unschedulable"
      - name: "odczytano powód ze zdarzeń schedulera"
        exec:
          timeout: 40s
          script: |
            ZLE=""
            V=$("$LFS458_ROOT"/scripts/odpowiedz.sh 11 powod)
            printf '%s' "$V" | grep -qiE 'insufficient +memory' || ZLE="$ZLE powod"
            [ -z "$ZLE" ] && echo "WYNIK: ok" || echo "WYNIK: brakuje lub nie zgadza sie:$ZLE"
          stdoutMatches: "WYNIK: ok"

  - id: task-3
    points: 4
    description: |
      **Rozprosz repliki po node'ach.**

      Utwórz Deployment **`rozproszony`** w `lfs458-m11`:

      - **2 repliki**, obraz `nginx:1.27-alpine`, etykieta `app=rozproszony`
      - reguła **`podAntiAffinity`** w wariancie `required`, która zabrania dwóm replikom
        stanąć na **tym samym node'ie**

      ```bash
      kubectl get pods -n lfs458-m11 -l app=rozproszony -o wide
      ```

      > Dlaczego dwie, a nie trzy? Zwykłe Pody nie trafiają na node control
      > plane (ma `taint`), więc do dyspozycji są **dwa** workery. Przy trzech
      > replikach i regule `required` trzecia zostałaby w `Pending` na zawsze —
      > i to jest właśnie pułapka anti-affinity typu `required`.
    hints:
      - "Reguła idzie do `spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution`."
      - "`topologyKey: kubernetes.io/hostname` znaczy „ta sama maszyna”. `labelSelector` musi wskazywać te same Pody, o których mowa — czyli `app=rozproszony`."
      - "Szkielet:\n\n```yaml\naffinity:\n  podAntiAffinity:\n    requiredDuringSchedulingIgnoredDuringExecution:\n      - labelSelector:\n          matchLabels:\n            app: rozproszony\n        topologyKey: kubernetes.io/hostname\n```"
    solution: |
      ```bash
      cat <<'EOF' | kubectl apply -f -
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rozproszony
        namespace: lfs458-m11
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: rozproszony
        template:
          metadata:
            labels:
              app: rozproszony
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: rozproszony
                    topologyKey: kubernetes.io/hostname
            containers:
              - name: web
                image: nginx:1.27-alpine
      EOF

      kubectl rollout status deployment/rozproszony -n lfs458-m11
      kubectl get pods -n lfs458-m11 -l app=rozproszony -o wide
      ```
    checks:
      - name: "Deployment rozproszony ma regułę anti-affinity"
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: lfs458-m11
          name: rozproszony
        assert:
          - path: "{.spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[*].topologyKey}"
            op: eq
            value: "kubernetes.io/hostname"
            message: "reguła ma rozpraszać po node'ach — topologyKey to kubernetes.io/hostname"
      - name: "obie repliki są gotowe"
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: lfs458-m11
          name: rozproszony
        assert:
          - path: "{.status.readyReplicas}"
            op: eq
            value: 2
            message: "jeśli jedna replika wisi w Pending, reguła nie ma gdzie jej postawić"
      - name: "repliki stoją na dwóch różnych node'ach"
        exec:
          timeout: 40s
          script: |
            K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
            n=$($K get pods -n lfs458-m11 -l app=rozproszony \
                  -o jsonpath='{.items[*].spec.nodeName}' \
                | tr ' ' '\n' | grep -v '^$' | sort -u | wc -l | tr -d ' ')
            echo "roznych-nodow=$n"
          stdoutMatches: "roznych-nodow=2"

  - id: task-4
    points: 4
    description: |
      **Zarezerwuj node dla wybranych Podów.**

      1. Nałóż na node **`lfs458-worker2`** taint **`gpu=true:NoSchedule`**
      2. Uruchom w `lfs458-m11` Pod **`z-gpu`** (`nginx:1.27-alpine`), który
         **toleruje** ten taint **i** trafia właśnie na ten node

      Pamiętaj: `toleration` to tylko **zgoda**. Żeby Pod naprawdę tam wylądował,
      potrzebuje jeszcze czegoś, co go tam **przyciągnie**.

      ```bash
      kubectl describe node lfs458-worker2 | grep -i taint
      kubectl get pod z-gpu -n lfs458-m11 -o wide
      ```
    hints:
      - "`kubectl taint node lfs458-worker2 gpu=true:NoSchedule`. Zdejmuje się tym samym poleceniem z minusem na końcu."
      - "Wpis w Podzie: `tolerations: [{key: gpu, operator: Equal, value: \"true\", effect: NoSchedule}]`."
      - "Sam `toleration` nie wystarczy — Pod może wtedy wylądować gdziekolwiek. Dołóż `nodeSelector` z etykietą `dysk=ssd`, nadaną temu node'owi w zadaniu 1."
      - "Komplet:\n\n```yaml\nspec:\n  nodeSelector:\n    dysk: ssd\n  tolerations:\n    - key: gpu\n      operator: Equal\n      value: \"true\"\n      effect: NoSchedule\n```"
    solution: |
      ```bash
      kubectl taint node lfs458-worker2 gpu=true:NoSchedule --overwrite

      cat <<'EOF' | kubectl apply -f -
      apiVersion: v1
      kind: Pod
      metadata:
        name: z-gpu
        namespace: lfs458-m11
      spec:
        nodeSelector:
          dysk: ssd
        tolerations:
          - key: gpu
            operator: Equal
            value: "true"
            effect: NoSchedule
        containers:
          - name: web
            image: nginx:1.27-alpine
      EOF

      kubectl get pod z-gpu -n lfs458-m11 -o wide
      ```
    checks:
      - name: "node lfs458-worker2 ma taint gpu=true:NoSchedule"
        resource:
          apiVersion: v1
          kind: Node
          name: lfs458-worker2
        assert:
          - path: "{.spec.taints[*].key}"
            op: eq
            value: gpu
            quantifier: any
            message: "`kubectl taint node lfs458-worker2 gpu=true:NoSchedule`"
          - path: "{.spec.taints[?(@.key=='gpu')].effect}"
            op: eq
            value: NoSchedule
      - name: "Pod z-gpu toleruje ten taint"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: lfs458-m11
          name: z-gpu
        assert:
          - path: "{.spec.tolerations[*].key}"
            op: eq
            value: gpu
            quantifier: any
            message: "bez `toleration` Pod nie zostanie wpuszczony na ten node"
      - name: "Pod z-gpu działa na node'ie z taintem"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: lfs458-m11
          name: z-gpu
        assert:
          - path: "{.spec.nodeName}"
            op: eq
            value: lfs458-worker2
            message: "`toleration` to tylko zgoda — dołóż nodeSelector, żeby Pod tam trafił"
          - path: "{.status.phase}"
            op: eq
            value: Running

  - id: task-5
    points: 3
    optional: true
    description: |
      **Preferencja, która nie blokuje.**

      Zadanie dodatkowe. Utwórz Pod **`preferowany`** w `lfs458-m11`
      (`nginx:1.27-alpine`) z regułą `nodeAffinity`, która **preferuje**
      node z etykietą `dysk=nvme` — a takiego node'a w klastrze **nie ma**.

      Użyj `preferredDuringSchedulingIgnoredDuringExecution` z wagą `50`.

      Pod mimo to ma wystartować — bo preferencja tylko dodaje punkty,
      a nie stawia warunku. Porównaj to z zadaniem 2, gdzie `required`
      zatrzymał Poda na zawsze.
    hints:
      - "Struktura: `spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution` to **lista**, a każdy element ma `weight` i `preference`."
      - "`preference` zawiera `matchExpressions` — tak jak przy `required`, ale w innym miejscu drzewa."
      - "```yaml\naffinity:\n  nodeAffinity:\n    preferredDuringSchedulingIgnoredDuringExecution:\n      - weight: 50\n        preference:\n          matchExpressions:\n            - key: dysk\n              operator: In\n              values: [nvme]\n```"
    solution: |
      ```bash
      cat <<'EOF' | kubectl apply -f -
      apiVersion: v1
      kind: Pod
      metadata:
        name: preferowany
        namespace: lfs458-m11
      spec:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 50
                preference:
                  matchExpressions:
                    - key: dysk
                      operator: In
                      values: [nvme]
        containers:
          - name: web
            image: nginx:1.27-alpine
      EOF

      kubectl get pod preferowany -n lfs458-m11 -o wide
      ```
    checks:
      - name: "Pod preferowany ma `preferred`, a nie `required`"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: lfs458-m11
          name: preferowany
        assert:
          - path: "{.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution[*].weight}"
            op: eq
            value: 50
            message: "użyj `preferredDuringSchedulingIgnoredDuringExecution` z wagą 50"
          - path: "{.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution}"
            op: notExists
            message: "reguła `required` zatrzymałaby Poda w Pending — o to właśnie chodzi w tym porównaniu"
      - name: "mimo niespełnionej preferencji Pod działa"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: lfs458-m11
          name: preferowany
        assert:
          - path: "{.status.phase}"
            op: eq
            value: Running
            message: "preferencja nie blokuje planowania — Pod powinien wystartować na dowolnym node'ie"

  - id: task-6
    points: 2
    description: |
      **Zapytaj klaster, gdzie co może stanąć.**

      Trzy pytania o node'y i o to, co je chroni przed workloadami.
      Odpowiedzi czytasz wprost z klastra.
    quiz:
      pytania:
        - pytanie: |
            Jaki `taint` nosi control plane node tego klastra?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get node lfs458-control-plane \
                -o jsonpath='{.spec.taints[0].key}'
          mylne: ["node-role.kubernetes.io/master",
                  "node.kubernetes.io/unschedulable",
                  "node.kubernetes.io/not-ready"]
          wskazowka: "kubectl describe node lfs458-control-plane | grep -i taint"

        - pytanie: |
            Jaki **efekt** ma ten `taint`?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get node lfs458-control-plane \
                -o jsonpath='{.spec.taints[0].effect}'
          mylne: ["NoExecute", "PreferNoSchedule", "NoAdmission"]
          wskazowka: "ten sam `describe` — efekt stoi po dwukropku"

        - pytanie: |
            Ile node'ów w tym klastrze przyjmie zwykłego Poda **bez** żadnego `toleration`?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get nodes -o json \
                | python3 -c 'import json,sys; print(sum(1 for n in json.load(sys.stdin)["items"] if not n["spec"].get("taints")))'
          mylne: ["1", "3", "0"]
          wskazowka: "policz node'y bez taintów: `kubectl get nodes -o custom-columns=W:.metadata.name,T:.spec.taints`"

  - id: task-7
    points: 4
    przygotuj:
      opis: "przygotowuję Deployment skalowany…"
      timeout: 3m
      script: |
        K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
        $K create namespace lfs458-m11 --dry-run=client -o yaml | $K apply -f - >/dev/null
        cat <<'YAML' | $K apply -f - >/dev/null
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: skalowany, namespace: lfs458-m11}
        spec:
          replicas: 1
          selector: {matchLabels: {app: skalowany}}
          template:
            metadata: {labels: {app: skalowany}}
            spec:
              containers:
                - name: web
                  image: nginx:1.27-alpine
                  resources: {requests: {cpu: 20m}}
        ---
        apiVersion: v1
        kind: Service
        metadata: {name: skalowany, namespace: lfs458-m11}
        spec:
          selector: {app: skalowany}
          ports: [{port: 80}]
        YAML
        $K rollout status deployment/skalowany -n lfs458-m11 --timeout=120s >/dev/null
    description: |
      **Niech Deployment skaluje się sam.**

      W `lfs458-m11` działa już Deployment **`skalowany`** (nginx,
      `requests: cpu: 20m`) i Service o tej samej nazwie — przygotował je `labctl`.

      1. Utwórz HPA **`skalowany`** dla tego Deploymentu: od **1** do **5**
         replik, cel **50%** CPU.
      2. Poczekaj, aż w kolumnie `TARGETS` zamiast `<unknown>` pojawi się zużycie.
      3. Wygeneruj ruch i obserwuj HPA:

      ```bash
      kubectl run obciazenie -n lfs458-m11 --image=busybox:1.36 --restart=Never -- \
        /bin/sh -c "while true; do wget -q -O- http://skalowany >/dev/null; done"
      kubectl get hpa skalowany -n lfs458-m11 -w
      ```

      4. Gdy repliki urosną, usuń Pod `obciazenie` i zobacz, jak HPA wraca
         do jednej repliki.

      > Cel 50% liczy się od `requests` — tutaj to 10m CPU na Pod. Skalowanie
      > w dół trwa domyślnie około 5 minut i tak ma być.
    hints:
      - "Jednym poleceniem: `kubectl autoscale deployment skalowany -n lfs458-m11 --cpu=50% --min=1 --max=5`."
      - "`<unknown>` w kolumnie TARGETS przez pierwszą minutę to normalne — metrics-server zbiera dane co kilkanaście sekund. Jeśli trwa dłużej, przeczytaj zdarzenia: `kubectl describe hpa skalowany -n lfs458-m11`."
      - "Jeśli HPA nie rusza w górę, uruchom drugi generator ruchu — Pod `obciazenie-2` z tym samym poleceniem."
    solution: |
      ```bash
      kubectl autoscale deployment skalowany -n lfs458-m11 --cpu=50% --min=1 --max=5
      kubectl get hpa skalowany -n lfs458-m11          # po minucie: cpu: 0%/50%

      kubectl run obciazenie -n lfs458-m11 --image=busybox:1.36 --restart=Never -- \
        /bin/sh -c "while true; do wget -q -O- http://skalowany >/dev/null; done"
      kubectl get hpa skalowany -n lfs458-m11 -w       # cpu: 97%/50%, REPLICAS 5

      kubectl describe hpa skalowany -n lfs458-m11 | sed -n '/Events/,$p'
      kubectl delete pod obciazenie -n lfs458-m11      # po ok. 5 minutach: 1 replika
      ```
    checks:
      - name: "HPA skalowany obejmuje Deployment skalowany, od 1 do 5 replik"
        resource:
          apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          namespace: lfs458-m11
          name: skalowany
        assert:
          - path: "{.spec.scaleTargetRef.name}"
            op: eq
            value: skalowany
          - path: "{.spec.minReplicas}"
            op: eq
            value: 1
          - path: "{.spec.maxReplicas}"
            op: eq
            value: 5
      - name: "cel to 50% CPU"
        resource:
          apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          namespace: lfs458-m11
          name: skalowany
        assert:
          - path: "{.spec.metrics[0].resource.name}"
            op: eq
            value: cpu
          - path: "{.spec.metrics[0].resource.target.averageUtilization}"
            op: eq
            value: 50
      - name: "HPA mierzy zużycie (zamiast <unknown>)"
        resource:
          apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          namespace: lfs458-m11
          name: skalowany
        assert:
          - path: "{.status.currentMetrics[0].resource.current.averageUtilization}"
            op: exists
            message: "metryk jeszcze nie ma — poczekaj minutę i zajrzyj do `kubectl describe hpa skalowany -n lfs458-m11`"
      # Dowód skalowania pod ruchem: zdarzenie „above target” (żyje godzinę)
      # albo — gdy ruch nadal trwa — więcej niż jedna docelowa replika.
      - name: "HPA przynajmniej raz dołożył repliki z powodu obciążenia"
        exec:
          timeout: 40s
          script: |
            K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
            ZDARZENIE=$($K get events -n lfs458-m11 \
                          --field-selector involvedObject.name=skalowany,reason=SuccessfulRescale \
                          -o jsonpath='{.items[*].message}' 2>/dev/null | grep -c "above target")
            DOCELOWE=$($K get hpa skalowany -n lfs458-m11 -o jsonpath='{.status.desiredReplicas}' 2>/dev/null)
            if [ "${ZDARZENIE:-0}" -gt 0 ] || [ "${DOCELOWE:-1}" -gt 1 ]; then
              echo "WYNIK: skalowanie w górę było"
            else
              echo "WYNIK: brak skalowania w górę — uruchom generator ruchu"
            fi
          stdoutMatches: "WYNIK: skalowanie w górę było"

  # Quiz ma własne Pody w osobnym namespace — klasy QoS i Pod z profilem
  # schedulera, którego nikt nie obsługuje (sekcje 2 i 3 rozdziału).
  - id: task-8
    points: 2
    description: |
      **Odczytaj, jak klaster potraktował Pody.**

      `labctl` utworzył w `lfs458-m11-quiz` cztery Pody o różnych ustawieniach.
      Cztery pytania — odpowiedzi czytasz z klastra.

      ```bash
      kubectl get pods -n lfs458-m11-quiz
      ```
    quiz:
      przygotuj:
        timeout: 3m
        script: |
          K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
          $K create namespace lfs458-m11-quiz --dry-run=client -o yaml | $K apply -f - >/dev/null
          cat <<'YAML' | $K apply -f - >/dev/null
          apiVersion: v1
          kind: Pod
          metadata: {name: tylko-requests, namespace: lfs458-m11-quiz}
          spec:
            containers:
              - {name: web, image: nginx:1.27-alpine, resources: {requests: {cpu: 50m, memory: 64Mi}}}
          ---
          apiVersion: v1
          kind: Pod
          metadata: {name: tylko-limity, namespace: lfs458-m11-quiz}
          spec:
            containers:
              - {name: web, image: nginx:1.27-alpine, resources: {limits: {cpu: 100m, memory: 128Mi}}}
          ---
          apiVersion: v1
          kind: Pod
          metadata: {name: bez-zasobow, namespace: lfs458-m11-quiz}
          spec:
            containers:
              - {name: web, image: nginx:1.27-alpine}
          ---
          apiVersion: v1
          kind: Pod
          metadata: {name: sierota, namespace: lfs458-m11-quiz}
          spec:
            schedulerName: upakuj
            containers:
              - {name: web, image: nginx:1.27-alpine}
          YAML
          sleep 5
      pytania:
        - pytanie: |
            Jaką klasę QoS ma Pod `tylko-requests`?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get pod tylko-requests -n lfs458-m11-quiz \
                -o jsonpath='{.status.qosClass}'
          mylne: ["BestEffort", "Guaranteed", "Burstable"]
          wskazowka: "kubectl get pod tylko-requests -n lfs458-m11-quiz -o jsonpath='{.status.qosClass}'"

        - pytanie: |
            A jaką klasę QoS ma Pod `tylko-limity` — z samymi `limits`, bez `requests`?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get pod tylko-limity -n lfs458-m11-quiz \
                -o jsonpath='{.status.qosClass}'
          mylne: ["BestEffort", "Burstable", "Guaranteed"]
          wskazowka: "sprawdź klasę — i zajrzyj, jakie `requests` zapisał apiserver: kubectl get pod tylko-limity -n lfs458-m11-quiz -o yaml | grep -A6 resources"

        - pytanie: |
            W jakim stanie jest Pod `sierota`?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get pod sierota -n lfs458-m11-quiz \
                -o jsonpath='{.status.phase}'
          mylne: ["Running", "Failed", "Unknown"]
          wskazowka: "kubectl get pod sierota -n lfs458-m11-quiz"

        - pytanie: |
            Ile zdarzeń (`Events`) zapisał klaster dla Poda `sierota`?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get events -n lfs458-m11-quiz \
                --field-selector involvedObject.name=sierota --no-headers 2>/dev/null | wc -l | tr -d ' '
          mylne: ["1", "2", "3"]
          wskazowka: "kubectl describe pod sierota -n lfs458-m11-quiz — i sprawdź jego spec.schedulerName"

  - id: task-9
    points: 3
    description: |
      **Nadaj Podowi priorytet.**

      1. Utwórz PriorityClass **`lfs458-wazne`** o wartości **100000**.
      2. W `lfs458-m11` utwórz Poda **`wazny`** (`nginx:1.27-alpine`),
         który z niej korzysta.
      3. Zobacz, co apiserver zapisał w Podzie:

      ```bash
      kubectl get pod wazny -n lfs458-m11 -o jsonpath='{.spec.priorityClassName} {.spec.priority}{"\n"}'
      ```

      > PriorityClass jest obiektem **klastrowym** — nie ma namespace'u.
    hints:
      - "Najprościej: `kubectl create priorityclass lfs458-wazne --value=100000`."
      - "W Podzie wystarczy pole `spec.priorityClassName: lfs458-wazne`; liczbę w `spec.priority` dopisze sam apiserver przy tworzeniu Poda."
    solution: |
      ```bash
      kubectl create priorityclass lfs458-wazne --value=100000 \
        --description="lab 11"

      cat <<'EOF' | kubectl apply -f -
      apiVersion: v1
      kind: Pod
      metadata: {name: wazny, namespace: lfs458-m11}
      spec:
        priorityClassName: lfs458-wazne
        containers:
          - {name: web, image: nginx:1.27-alpine}
      EOF

      kubectl get pod wazny -n lfs458-m11 \
        -o jsonpath='{.spec.priorityClassName} {.spec.priority}{"\n"}'
      # lfs458-wazne 100000
      ```
    checks:
      - name: "PriorityClass lfs458-wazne ma wartość 100000"
        resource:
          apiVersion: scheduling.k8s.io/v1
          kind: PriorityClass
          name: lfs458-wazne
        assert:
          - path: "{.value}"
            op: eq
            value: 100000
      - name: "Pod wazny korzysta z tej klasy i działa"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: lfs458-m11
          name: wazny
        assert:
          - path: "{.spec.priorityClassName}"
            op: eq
            value: lfs458-wazne
          - path: "{.status.phase}"
            op: eq
            value: Running
      - name: "apiserver wpisał priorytet do spec.priority"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: lfs458-m11
          name: wazny
        assert:
          - path: "{.spec.priority}"
            op: eq
            value: 100000
            message: "priorytet ustala się przy tworzeniu Poda — Pod utworzony przed PriorityClass trzeba utworzyć ponownie"

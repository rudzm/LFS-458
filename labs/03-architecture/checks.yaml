module: "03"
title: "Kubernetes Architecture — komponenty pod maską"
chapter: 3
chapterTitle: "Kubernetes Architecture"
day: 1
environment: kind-basic

intro: |
  Zejdziesz poziom niżej niż w module 01: obejrzysz sieć klastra od środka,
  udowodnisz, na czym polega wspólna przestrzeń nazw w Podzie, i utworzysz
  Poda **z pominięciem serwera API**.

  W kilku zadaniach wejdziesz do node'a. Node klastra Kind to zwykły kontener:

  ```bash
  docker exec -it lfs458-worker bash     # albo: nerdctl exec -it lfs458-worker bash
  ```

# Namespace stawiamy za kursanta: zadanie 1 to już pytania, a Pody
# z zadań 2 i 3 muszą gdzieś trafić.
setup:
  - name: "Tworzę namespace lfs458-m03"
    timeout: 1m
    script: |
      K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
      $K create namespace lfs458-m03 --dry-run=client -o yaml | $K apply -f -

cleanup:
  - name: "Usuwam namespace lfs458-m03"
    timeout: 3m
    script: |
      kubectl --context "${KUBECONTEXT:-kind-lfs458}" delete namespace lfs458-m03 --ignore-not-found --wait=true
  - name: "Usuwam manifesty static Podów z node'ów"
    timeout: 3m
    ignoreError: true
    script: |
      CRI="${CONTAINER_CLI:-docker}"
      for node in lfs458-worker lfs458-worker2; do
        "$CRI" exec "$node" rm -f /etc/kubernetes/manifests/statyczny.yaml 2>/dev/null || true
      done
      echo "manifesty static Podów usunięte"

tasks:

  - id: task-1
    points: 4
    description: |
      **Zinwentaryzuj sieć klastra.**

      Pięć pytań o to, jak klaster rozdaje adresy i kto za to odpowiada.
      Warianty pochodzą z Twojego klastra — odpowiedź trzeba sprawdzić.

      > Zwróć uwagę na relację między pulą klastra a wycinkiem node'a —
      > każdy node dostaje własny kawałek i to controller-manager mu go
      > przydziela.
    quiz:
      pytania:
        - pytanie: |
            Jak nazywa się DaemonSet z **CNI pluginem** tego klastra?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get ds -n kube-system \
                -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep -v '^kube-proxy$' | head -1
          mylne: ["calico-node", "cilium", "flannel"]
          wskazowka: "kubectl get ds -n kube-system — jeden z nich to kube-proxy, drugi to CNI plugin"

        - pytanie: |
            Jaka jest pula adresów Podów **całego klastra**?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" -n kube-system get cm kubeadm-config \
                -o jsonpath='{.data.ClusterConfiguration}' | awk '/podSubnet:/ {print $2}'
          mylne: ["10.0.0.0/8"]
          mylne_z:
            script: |
              K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
              $K -n kube-system get cm kubeadm-config -o jsonpath='{.data.ClusterConfiguration}' \
                | awk '/serviceSubnet:/ {print $2}'
              $K get nodes -o jsonpath='{.items[*].spec.podCIDR}'
          wskazowka: "kubectl -n kube-system get cm kubeadm-config -o yaml | grep -A4 networking"

        - pytanie: |
            Jaki wycinek tej puli dostał node `lfs458-worker`?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get node lfs458-worker \
                -o jsonpath='{.spec.podCIDR}'
          mylne_z:
            script: |
              K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
              $K get nodes -o jsonpath='{.items[*].spec.podCIDR}'; echo
              $K -n kube-system get cm kubeadm-config -o jsonpath='{.data.ClusterConfiguration}' \
                | awk '/podSubnet:/ {print $2}'
          wskazowka: "kubectl get nodes -o custom-columns=NODE:.metadata.name,CIDR:.spec.podCIDR"

        - pytanie: |
            Jaki adres ma usługa **DNS** klastra (Service `kube-dns`)?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get svc kube-dns -n kube-system \
                -o jsonpath='{.spec.clusterIP}'
          mylne: ["10.96.0.1", "10.96.0.53", "10.244.0.10"]
          wskazowka: "kubectl get svc -n kube-system kube-dns"

        - pytanie: |
            W jakim trybie pracuje **kube-proxy**?
          odpowiedz:
            script: |
              M=$(kubectl --context "${KUBECONTEXT:-kind-lfs458}" -n kube-system get cm kube-proxy \
                    -o jsonpath='{.data.config\.conf}' | awk '/^mode:/ {print $2}' | tr -d '"')
              echo "${M:-iptables}"
          mylne: ["ipvs", "nftables", "ebpf"]
          wskazowka: "kubectl -n kube-system get cm kube-proxy -o yaml | grep mode"

  - id: task-2
    points: 3
    description: |
      **Udowodnij, że kontenery w jednym Podzie dzielą sieć.**

      Utwórz w `lfs458-m03` Poda o nazwie `wspolna-siec` z **dwoma kontenerami**:

      | Kontener | Obraz | Rola |
      |---|---|---|
      | `serwer` | `hashicorp/http-echo:1.0` | nasłuchuje na porcie **5678** i odpowiada tekstem `architektura` |
      | `klient` | `busybox:1.36` | nie robi nic (`sleep 3600`), służy do testów |

      Potem z kontenera `klient` odpytaj serwer **po `localhost`**:

      ```bash
      kubectl exec -n lfs458-m03 wspolna-siec -c klient -- wget -qO- http://localhost:5678
      ```

      Gdyby to były dwa osobne Pody, `localhost` nie zadziałałby nigdy.
    hints:
      - "Poda z dwoma kontenerami nie zrobisz `kubectl run` — potrzebny jest plik YAML z listą `spec.containers`."
      - "`http-echo` przyjmuje argumenty: `-text=architektura` oraz `-listen=:5678`. Podaje się je w polu `args`."
      - "Busybox bez polecenia od razu się kończy. Daj mu `command: [\"sleep\", \"3600\"]`."
      - "Szkielet:\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: wspolna-siec\n  namespace: lfs458-m03\nspec:\n  containers:\n    - name: serwer\n      image: hashicorp/http-echo:1.0\n      args: [\"-text=architektura\", \"-listen=:5678\"]\n    - name: klient\n      image: busybox:1.36\n      command: [\"sleep\", \"3600\"]\n```"
    solution: |
      ```bash
      cat <<'EOF' | kubectl apply -f -
      apiVersion: v1
      kind: Pod
      metadata:
        name: wspolna-siec
        namespace: lfs458-m03
      spec:
        containers:
          - name: serwer
            image: hashicorp/http-echo:1.0
            args: ["-text=architektura", "-listen=:5678"]
          - name: klient
            image: busybox:1.36
            command: ["sleep", "3600"]
      EOF

      kubectl exec -n lfs458-m03 wspolna-siec -c klient -- wget -qO- http://localhost:5678
      ```

      Oba kontenery mają ten sam adres IP Poda i wspólny `localhost`, bo trzyma
      je razem kontener `pause`.
    checks:
      - name: "Pod wspolna-siec ma dwa kontenery i działa"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: lfs458-m03
          name: wspolna-siec
        assert:
          - path: "{.spec.containers[*].name}"
            count:
              op: eq
              value: 2
            message: "Pod ma mieć dokładnie dwa kontenery: serwer i klient"
          - path: "{.status.phase}"
            op: eq
            value: Running
            message: "poczekaj, aż Pod wstanie — `kubectl get pod wspolna-siec -n lfs458-m03`"
      - name: "oba kontenery są gotowe"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: lfs458-m03
          name: wspolna-siec
        assert:
          - path: "{.status.containerStatuses[*].ready}"
            op: eq
            value: "true"
            quantifier: all
            count:
              op: eq
              value: 2
            message: "któryś kontener nie jest Ready — `kubectl describe pod wspolna-siec -n lfs458-m03`"
      - name: "kontener klient dosięga serwera po localhost"
        exec:
          timeout: 40s
          script: |
            kubectl --context "${KUBECONTEXT:-kind-lfs458}" exec -n lfs458-m03 wspolna-siec \
              -c klient -- wget -qO- --timeout=5 http://localhost:5678
          stdoutMatches: "architektura"

  - id: task-3
    points: 4
    description: |
      **Utwórz Poda z pominięciem serwera API.**

      Na node'ie **`lfs458-worker`** wpisz manifest Poda do katalogu, z którego
      kubelet czyta static Pody. Nazwij plik `statyczny.yaml`, a Poda —
      `statyczny`, z jednym kontenerem `nginx:1.27-alpine`.

      Nie używaj `kubectl apply`. Node klastra Kind to kontener, więc plik
      wpisujesz przez `docker exec` albo `nerdctl exec`.

      Potem znajdź go w API i sprawdź, **kto jest jego właścicielem**.

      > Nazwa Poda w API dostanie sufiks z nazwą node'a:
      > `statyczny-lfs458-worker`.
    hints:
      - "Katalog jest ten sam co na każdym klastrze kubeadm. Podpowiedź: `docker exec lfs458-worker grep staticPodPath /var/lib/kubelet/config.yaml`."
      - "Plik zapiszesz tak:\n\n```bash\ndocker exec -i lfs458-worker sh -c 'cat > /etc/kubernetes/manifests/statyczny.yaml' <<'EOF'\n…manifest…\nEOF\n```"
      - "Manifest to zwykły Pod — bez `namespace`, bo static Pody trafiają do `default`:\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: statyczny\nspec:\n  containers:\n    - name: web\n      image: nginx:1.27-alpine\n```"
      - "Kubelet zauważa plik w kilka sekund. Sprawdź: `kubectl get pods -o wide | grep statyczny`. Właściciela pokaże `kubectl get pod statyczny-lfs458-worker -o jsonpath='{.metadata.ownerReferences[0].kind}'`."
    solution: |
      ```bash
      docker exec -i lfs458-worker sh -c 'cat > /etc/kubernetes/manifests/statyczny.yaml' <<'EOF'
      apiVersion: v1
      kind: Pod
      metadata:
        name: statyczny
      spec:
        containers:
          - name: web
            image: nginx:1.27-alpine
      EOF

      kubectl get pods -o wide | grep statyczny
      kubectl get pod statyczny-lfs458-worker \
        -o jsonpath='{.metadata.ownerReferences[0].kind}/{.metadata.ownerReferences[0].name}'
      ```

      Właścicielem jest **Node**, nie ReplicaSet. Kubelet utworzył w API
      *mirror pod* — kopię lustrzaną tego, co uruchomił z dysku.
    checks:
      - name: "static Pod działa na node'ie lfs458-worker"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: default
          name: statyczny-lfs458-worker
        assert:
          - path: "{.status.phase}"
            op: eq
            value: Running
            message: "kubelet potrzebuje kilku sekund od zapisania pliku — sprawdź `kubectl get pods -o wide`"
          - path: "{.spec.nodeName}"
            op: eq
            value: lfs458-worker
            message: "Pod ma powstać na node'ie lfs458-worker"
      - name: "właścicielem Poda jest node, a nie kontroler"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: default
          name: statyczny-lfs458-worker
        assert:
          - path: "{.metadata.ownerReferences[*].kind}"
            op: eq
            value: Node
            message: "to ma być static Pod (właściciel: Node), a nie Pod utworzony przez `kubectl apply`"
      - name: "używa obrazu nginx:1.27-alpine"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: default
          name: statyczny-lfs458-worker
        assert:
          - path: "{.spec.containers[*].image}"
            op: eq
            value: "nginx:1.27-alpine"


  - id: task-4
    points: 3
    description: |
      **Znajdź porty komponentów.**

      Cztery pytania o to, gdzie słuchają komponenty control plane.
      Nie zgaduj — wyciągnij to z manifestów static Podów i ze statusu node'a.
    quiz:
      pytania:
        - pytanie: |
            Na którym porcie **serwer API** przyjmuje ruch HTTPS?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" -n kube-system get pod -l component=kube-apiserver -o json \
                | jq -r '.items[0].spec.containers[0].command[] | select(startswith("--secure-port="))' | cut -d= -f2
          mylne: ["443", "8443", "6444"]
          wskazowka: "kubectl -n kube-system get pod -l component=kube-apiserver -o yaml | grep secure-port"

        - pytanie: |
            Na którym porcie **etcd** obsługuje klientów?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" -n kube-system get pod -l component=etcd -o json \
                | jq -r '.items[0].spec.containers[0].command[] | select(startswith("--listen-client-urls="))' \
                | cut -d= -f2 | cut -d, -f1 | sed 's|.*:||'
          mylne: ["2380", "2381", "4001"]
          wskazowka: "kubectl -n kube-system get pod -l component=etcd -o yaml | grep listen-client-urls"

        - pytanie: |
            Na którym porcie **kubelet** wystawia swoje API?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get node lfs458-worker \
                -o jsonpath='{.status.daemonEndpoints.kubeletEndpoint.Port}'
          mylne: ["10255", "10248", "10256"]
          wskazowka: "kubectl get node lfs458-worker -o jsonpath='{.status.daemonEndpoints.kubeletEndpoint.Port}'"

        - pytanie: |
            Ile kontenerów ma Pod serwera API w `kube-system`?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get pod -n kube-system -l component=kube-apiserver \
                -o jsonpath='{.items[0].spec.containers[*].name}' | wc -w | tr -d ' '
          mylne: ["2", "3", "0"]
          wskazowka: "kubectl get pod -n kube-system -l component=kube-apiserver -o jsonpath='{.items[0].spec.containers[*].name}'"


  - id: task-5
    points: 2
    optional: true
    description: |
      **Sprawdź, czym naprawdę jest static Pod.**

      Zadanie dodatkowe. Spróbuj usunąć static Poda z zadania 3 przez API:

      ```bash
      kubectl delete pod statyczny-lfs458-worker
      kubectl get pods -o wide | grep statyczny
      ```

      Poczekaj kilkanaście sekund, sprawdź ponownie i odpowiedz na trzy pytania.
    quiz:
      pytania:
        - pytanie: |
            Jak nazywa się obiekt wskazany w `ownerReferences` Poda
            `statyczny-lfs458-worker`?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get pod statyczny-lfs458-worker -n default \
                -o jsonpath='{.metadata.ownerReferences[0].name}'
          mylne: ["kubelet"]
          mylne_z:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get nodes -o jsonpath='{.items[*].metadata.name}'
          wskazowka: "kubectl get pod statyczny-lfs458-worker -o yaml | grep -A5 ownerReferences"

        - pytanie: |
            Obiekt jakiego **rodzaju** jest tym właścicielem?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get pod statyczny-lfs458-worker -n default \
                -o jsonpath='{.metadata.ownerReferences[0].kind}'
          mylne: ["ReplicaSet", "DaemonSet", "Deployment"]
          wskazowka: "kubectl get pod statyczny-lfs458-worker -o jsonpath='{.metadata.ownerReferences[0].kind}'"

        - pytanie: |
            Pod wrócił po usunięciu. Ile **restartów** ma teraz jego kontener?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get pod statyczny-lfs458-worker -n default \
                -o jsonpath='{.status.containerStatuses[0].restartCount}'
          mylne_z:
            script: |
              N=$(kubectl --context "${KUBECONTEXT:-kind-lfs458}" get pod statyczny-lfs458-worker -n default \
                    -o jsonpath='{.status.containerStatuses[0].restartCount}')
              echo $((N + 1)) $((N + 2)) $((N + 5))
          wskazowka: "kolumna RESTARTS w `kubectl get pod statyczny-lfs458-worker`"

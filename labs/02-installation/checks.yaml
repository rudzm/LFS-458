module: "02"
title: "Installation and Configuration — klaster od zera"
chapter: 2
chapterTitle: "Installation and Configuration"
day: 1
environment: vagrant-kubeadm

intro: |
  Masz dwie maszyny z przygotowanym systemem i **żadnego klastra**. Zbudujesz go
  sam: `kubeadm init`, sieć, dołączenie worker node'a.

  ```bash
  cd env/vm/kubeadm
  vagrant ssh cp        # control plane node, 192.168.56.10
  vagrant ssh worker    # worker node,      192.168.56.11
  ```

  > **Weryfikator łączy się z kontekstem `kubeadm-lfs458`.** Dopóki nie
  > wyeksportujesz kubeconfiga na hosta (zadanie 1), wszystkie sprawdzenia będą
  > czerwone z komunikatem o brakującym kontekście — i to jest poprawne.

cleanup:
  - name: "Usuwam arkusz odpowiedzi"
    timeout: 30s
    ignoreError: true
    script: |
      rm -f "${ODPOWIEDZI:-$HOME/odpowiedzi}/lab-02.txt"
      echo "arkusz usunięty"
  - name: "Usuwam namespace lfs458-m02"
    timeout: 3m
    ignoreError: true
    script: |
      kubectl --context kubeadm-lfs458 delete namespace lfs458-m02 --ignore-not-found --wait=true

tasks:
  - id: task-1
    points: 4
    description: |
      **Postaw control plane i daj weryfikatorowi dostęp.**

      Na maszynie `cp` uruchom `kubeadm init` z pulą adresów Podów
      **`10.244.0.0/16`**, ogłaszając adres **`192.168.56.10`**.

      Potem skonfiguruj `kubectl` na maszynie `cp` **oraz** wyeksportuj
      kubeconfig na hosta jako kontekst **`kubeadm-lfs458`** — bez tego
      weryfikator nie ma jak sprawdzić Twojej pracy.

      > Node będzie w stanie `NotReady`. To nie awaria — brakuje sieci Podów,
      > którą dołożysz w kolejnym zadaniu.
    hints:
      - "`kubeadm init` przyjmuje flagi `--pod-network-cidr` i `--apiserver-advertise-address`. Uruchom go przez `sudo`."
      - "Po udanym `init` kubeadm sam wypisuje trzy polecenia do skonfigurowania `kubectl` (`mkdir -p $HOME/.kube` …). Wykonaj je na maszynie `cp`."
      - "Kubeconfig ściągniesz na hosta z katalogu z Vagrantfile'em:\n\n```bash\ncd env/vm/kubeadm\nvagrant ssh cp -c 'sudo cat /etc/kubernetes/admin.conf' > /tmp/admin.conf\n```"
      - "Adres w pobranym pliku wskazuje na 192.168.56.10 — to działa z hosta. Zmień nazwy na `kubeadm-lfs458` i scal z własnym kubeconfigiem:\n\n```bash\nsed -i.bak 's/kubernetes-admin@kubernetes/kubeadm-lfs458/' /tmp/admin.conf\n# jeśli wpis o tej nazwie już istnieje (np. z poprzedniego podejścia),\n# usuń go — przy scalaniu wygrywa PIERWSZY plik z listy KUBECONFIG\nkubectl config delete-context kubeadm-lfs458 2>/dev/null\nKUBECONFIG=~/.kube/config:/tmp/admin.conf kubectl config view --flatten > /tmp/merged\nmv /tmp/merged ~/.kube/config\n```"
    solution: |
      Na maszynie `cp`:

      ```bash
      sudo kubeadm init \
        --pod-network-cidr=10.244.0.0/16 \
        --apiserver-advertise-address=192.168.56.10

      mkdir -p $HOME/.kube
      sudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
      sudo chown $(id -u):$(id -g) $HOME/.kube/config
      ```

      Na hoście — gotowy skrypt robi to samo:

      ```bash
      labs/02-installation/solutions/export-kubeconfig.sh
      ```
    checks:
      - name: "kontekst kubeadm-lfs458 działa i widzi control plane node"
        resource:
          apiVersion: v1
          kind: Node
          labelSelector: "node-role.kubernetes.io/control-plane"
        assert:
          - path: "{.items[*].metadata.name}"
            count:
              op: eq
              value: 1
            message: "spodziewam się dokładnie jednego control plane node'a — sprawdź `kubectl get nodes`"
      - name: "control plane node nazywa się k8s-cp"
        resource:
          apiVersion: v1
          kind: Node
          labelSelector: "node-role.kubernetes.io/control-plane"
        assert:
          - path: "{.items[*].metadata.name}"
            op: eq
            value: k8s-cp
            message: "nazwa node'a bierze się z hostname maszyny — powinno być `k8s-cp`"
      - name: "pula adresów Podów to 10.244.0.0/16"
        resource:
          apiVersion: v1
          kind: Node
          labelSelector: "node-role.kubernetes.io/control-plane"
        assert:
          - path: "{.items[*].spec.podCIDR}"
            op: contains
            value: "10.244."
            message: "podCIDR ustawia się flagą --pod-network-cidr przy `kubeadm init`; zmiana wymaga postawienia klastra od nowa"
      - name: "komponenty control plane działają jako static Pody"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: kube-system
          labelSelector: "tier=control-plane"
        assert:
          - path: "{.items[*].metadata.name}"
            count:
              op: gte
              value: 3
            message: "w kube-system powinny być Pody apiservera, schedulera i controller-managera"

  - id: task-2
    points: 3
    description: |
      **Dołóż sieć Podów.**

      Zainstaluj **Cilium** — narzędzie `cilium` jest już na maszynie `cp`.
      Po chwili node przejdzie w stan `Ready`, a Pody CoreDNS wyjdą z `Pending`.

      Jest jeden haczyk, o który łatwo się potknąć także na produkcji: Cilium
      **domyślnie nie przejmuje się** pulą podaną w `kubeadm init` —
      rozdaje adresy z własnej (`10.0.0.0/8`). Zadaniem jest zainstalować go
      tak, żeby trzymał się puli klastra `10.244.0.0/16`, czyli tej, którą
      controller-manager pociął na wycinki per node.

      Sprawdź po drodze, co mówi `kubectl describe node k8s-cp` **przed**
      instalacją sieci — komunikat o braku CNI plugina jest bardzo konkretny.
    hints:
      - "`cilium install` wystarczy, żeby CNI plugin wylądował w klastrze. Postęp pokazuje `cilium status --wait`."
      - "Tryb przydzielania adresów ustawia się wartością chartu: `--set ipam.mode=kubernetes`. Mówi ona Cilium, żeby brał wycinek z pola `spec.podCIDR` node'a, zamiast prowadzić własną pulę."
      - "Przypnij wersję, żeby wszystkim wyszło to samo: `--version 1.20.3`."
      - "Komplet:\n\n```bash\ncilium install --version 1.20.3 --set ipam.mode=kubernetes\ncilium status --wait\n```"
    solution: |
      Na maszynie `cp`:

      ```bash
      kubectl describe node k8s-cp | sed -n '/Conditions/,/Addresses/p'   # przed

      cilium install --version 1.20.3 --set ipam.mode=kubernetes
      cilium status --wait

      kubectl get nodes
      kubectl get pods -A -o wide
      ```

      Adresy Podów mają teraz wyjść z `10.244.x.x` — z wycinka przydzielonego
      node'owi, a nie z własnej puli Cilium.
    checks:
      - name: "control plane node jest w stanie Ready"
        resource:
          apiVersion: v1
          kind: Node
          labelSelector: "node-role.kubernetes.io/control-plane"
        assert:
          - path: "{.items[*].status.conditions[?(@.type=='Ready')].status}"
            op: eq
            value: "True"
            message: "node wciąż NotReady — `kubectl describe node` powie, czego brakuje"
      - name: "Pody CoreDNS działają"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: kube-system
          labelSelector: "k8s-app=kube-dns"
        assert:
          - path: "{.items[*].status.phase}"
            op: eq
            value: Running
            quantifier: all
            count:
              op: gte
              value: 1
            message: "CoreDNS zostaje w Pending, dopóki nie ma sieci Podów"
      - name: "działa CNI plugin (DaemonSet na każdym node'ie)"
        resource:
          apiVersion: apps/v1
          kind: DaemonSet
          allNamespaces: true
        assert:
          - path: "{.items[?(@.status.numberReady>0)].metadata.name}"
            op: matches
            value: "flannel|calico|cilium|weave|kube-router"
            quantifier: any
            message: "nie widzę działającego DaemonSetu z CNI pluginem"
      # Sedno zadania: bez `ipam.mode=kubernetes` Pody dostają adresy z puli
      # Cilium (10.0.0.0/8), a nie z wycinka node'a — klaster działa, ale pula
      # z `kubeadm init` jest ignorowana.
      - name: "Pody dostają adresy z puli podanej w kubeadm init"
        exec:
          timeout: 60s
          script: |
            K="kubectl --context ${KUBECONTEXT:-kubeadm-lfs458}"
            IP=$($K -n kube-system get pod -l k8s-app=kube-dns \
                   -o jsonpath='{.items[0].status.podIP}' 2>/dev/null)
            case "$IP" in
              10.244.*) echo "podIP=$IP (z puli klastra)" ;;
              "")       echo "nie ma jeszcze Poda CoreDNS z adresem" ;;
              *)        echo "podIP=$IP — to nie pula 10.244.0.0/16; sprawdź ipam.mode" ;;
            esac
          stdoutMatches: "z puli klastra"

  - id: task-3
    points: 4
    description: |
      **Dołącz worker node.**

      Na maszynie `cp` wygeneruj polecenie dołączenia, a potem uruchom je
      na maszynie `worker`. Klaster ma mieć **dwa node'y**, oba `Ready`.

      Zastanów się przy okazji: co dokładnie dostaje node, gdy „dołącza”?
      Odpowiedź jest w zadaniu 4.
    hints:
      - "Na `cp`: `kubeadm token create --print-join-command` wypisuje gotowe polecenie razem z tokenem i odciskiem CA."
      - "Polecenie `kubeadm join` uruchamiasz na maszynie `worker` przez `sudo`."
      - "Token żyje 24 godziny. Jeśli wygasł, wygeneruj nowy tym samym poleceniem."
      - "Komplet:\n\n```bash\n# na cp\nkubeadm token create --print-join-command\n# skopiuj wynik i na worker:\nsudo kubeadm join 192.168.56.10:6443 --token … --discovery-token-ca-cert-hash sha256:…\n```"
    solution: |
      ```bash
      # na maszynie cp
      JOIN=$(kubeadm token create --print-join-command)
      echo "$JOIN"

      # na maszynie worker
      sudo kubeadm join 192.168.56.10:6443 --token <token> \
        --discovery-token-ca-cert-hash sha256:<hash>
      ```

      Z hosta jednym poleceniem:

      ```bash
      cd env/vm/kubeadm
      JOIN=$(vagrant ssh cp -c "sudo kubeadm token create --print-join-command" 2>/dev/null | tr -d '\r')
      vagrant ssh worker -c "sudo $JOIN"
      ```
    checks:
      - name: "klaster ma dwa node'y"
        resource:
          apiVersion: v1
          kind: Node
        assert:
          - path: "{.items[*].metadata.name}"
            count:
              op: eq
              value: 2
            message: "spodziewam się dwóch node'ów: k8s-cp i k8s-worker"
      - name: "oba node'y są Ready"
        resource:
          apiVersion: v1
          kind: Node
        assert:
          - path: "{.items[*].status.conditions[?(@.type=='Ready')].status}"
            op: eq
            value: "True"
            quantifier: all
            message: "po dołączeniu node potrzebuje kilkudziesięciu sekund na start CNI — poczekaj i sprawdź ponownie"
      - name: "worker node nazywa się k8s-worker i nie ma roli control plane"
        resource:
          apiVersion: v1
          kind: Node
          name: k8s-worker
        assert:
          - path: "{.metadata.labels['node-role\\.kubernetes\\.io/control-plane']}"
            op: notExists
            message: "k8s-worker nie powinien mieć etykiety roli control plane"

  - id: task-4
    points: 4
    description: |
      **Przeczytaj, co kubeadm po sobie zostawił.**

      Zapisz wyniki w arkuszu **`~/odpowiedzi/lab-02.txt`** — zwykłym pliku
      tekstowym, po jednej parze `klucz=wartość` na linię:

      | Klucz | Co ma zawierać |
      |---|---|
      | `podcidr` | pula adresów Podów zapisana w konfiguracji klastra |
      | `endpoint` | adres i port, pod którym node'y widzą apiserver |
      | `manifesty` | katalog na node'ie, z którego kubelet czyta static Pody |
      | `ca-wygasa` | data ważności certyfikatu CA klastra (`RRRR-MM-DD`) |

      Gdzie szukać:

      ```bash
      kubectl -n kube-system get cm kubeadm-config -o yaml
      sudo ls /etc/kubernetes/manifests
      sudo kubeadm certs check-expiration
      ```
    hints:
      - "ConfigMapa `kubeadm-config` w namespace `kube-system` trzyma całą `ClusterConfiguration` — w niej jest `networking.podSubnet` i `controlPlaneEndpoint` lub `localAPIEndpoint`."
      - "Katalog ze static Podami to ta sama ścieżka na każdym klastrze kubeadm — zobacz `sudo ls /etc/kubernetes/manifests` na maszynie `cp`."
      - "`sudo kubeadm certs check-expiration` wypisuje tabelę; wiersz `ca` ma datę w formacie `Aug 21, 2036`. Do arkusza wpisz ją jako `2036-08-21`."
      - "Endpoint to `192.168.56.10:6443` — ten sam adres, który podajesz przy `kubeadm join`."
    solution: |
      ```bash
      mkdir -p ~/odpowiedzi
      cat > ~/odpowiedzi/lab-02.txt <<'EOF'
      podcidr=10.244.0.0/16
      endpoint=192.168.56.10:6443
      manifesty=/etc/kubernetes/manifests
      ca-wygasa=2036-08-21
      EOF
      ```
    checks:
      - name: "namespace lfs458-m02 istnieje"
        resource:
          apiVersion: v1
          kind: Namespace
          name: lfs458-m02
        assert:
          - path: "{.status.phase}"
            op: eq
            value: Active
      - name: "podano pulę adresów Podów"
        exec:
          timeout: 40s
          script: |
            ZLE=""
            V=$("$LFS458_ROOT"/scripts/odpowiedz.sh 02 podcidr)
            [ "$V" = '10.244.0.0/16' ] || ZLE="$ZLE podcidr"
            [ -z "$ZLE" ] && echo "WYNIK: ok" || echo "WYNIK: brakuje lub nie zgadza sie:$ZLE"
          stdoutMatches: "WYNIK: ok"
      - name: "podano adres apiservera"
        exec:
          timeout: 40s
          script: |
            ZLE=""
            V=$("$LFS458_ROOT"/scripts/odpowiedz.sh 02 endpoint)
            printf '%s' "$V" | grep -qE '192\.168\.56\.10:6443' || ZLE="$ZLE endpoint"
            [ -z "$ZLE" ] && echo "WYNIK: ok" || echo "WYNIK: brakuje lub nie zgadza sie:$ZLE"
          stdoutMatches: "WYNIK: ok"
      - name: "podano katalog ze static Podami"
        exec:
          timeout: 40s
          script: |
            ZLE=""
            V=$("$LFS458_ROOT"/scripts/odpowiedz.sh 02 manifesty)
            [ "$V" = '/etc/kubernetes/manifests' ] || ZLE="$ZLE manifesty"
            [ -z "$ZLE" ] && echo "WYNIK: ok" || echo "WYNIK: brakuje lub nie zgadza sie:$ZLE"
          stdoutMatches: "WYNIK: ok"
      - name: "podano datę wygaśnięcia CA w formacie RRRR-MM-DD"
        exec:
          timeout: 40s
          script: |
            ZLE=""
            V=$("$LFS458_ROOT"/scripts/odpowiedz.sh 02 ca-wygasa)
            printf '%s' "$V" | grep -qE '^20[0-9]{2}-[0-1][0-9]-[0-3][0-9]$' || ZLE="$ZLE ca-wygasa"
            [ -z "$ZLE" ] && echo "WYNIK: ok" || echo "WYNIK: brakuje lub nie zgadza sie:$ZLE"
          stdoutMatches: "WYNIK: ok"

  - id: task-5
    points: 3
    optional: true
    description: |
      **Pozwól uruchamiać zwykłe Pody na node'ie control plane.**

      `kubeadm` nakłada na control plane node `taint`
      `node-role.kubernetes.io/control-plane:NoSchedule`, żeby nie lądowały tam
      workloadów użytkownika. W małym klastrze bywa to marnotrawstwo.

      Zdejmij ten `taint` i sprawdź, że zniknął. Etykieta roli ma zostać —
      usuwasz `taint`, nie rolę.
    hints:
      - "`kubectl describe node k8s-cp | grep -i taint` pokaże, co jest nałożone."
      - "Taint zdejmuje się tym samym poleceniem co nakładanie, z minusem na końcu: `kubectl taint nodes <node> <klucz>:<efekt>-`."
      - "Komplet: `kubectl taint nodes k8s-cp node-role.kubernetes.io/control-plane:NoSchedule-`"
    solution: |
      ```bash
      kubectl describe node k8s-cp | grep -i taint
      kubectl taint nodes k8s-cp node-role.kubernetes.io/control-plane:NoSchedule-
      kubectl describe node k8s-cp | grep -i taint
      ```
    checks:
      - name: "control plane node nie ma już taintu NoSchedule"
        resource:
          apiVersion: v1
          kind: Node
          labelSelector: "node-role.kubernetes.io/control-plane"
        assert:
          - path: "{.items[*].spec.taints[*].key}"
            op: eq
            value: "node-role.kubernetes.io/control-plane"
            quantifier: none
            message: "taint nadal jest — zdejmij go poleceniem z minusem na końcu"
      - name: "etykieta roli control plane została zachowana"
        resource:
          apiVersion: v1
          kind: Node
          labelSelector: "node-role.kubernetes.io/control-plane"
        assert:
          - path: "{.items[*].metadata.name}"
            count:
              op: eq
              value: 1
            message: "usuwamy taint, nie etykietę roli — node ma dalej być widoczny jako control plane"

module: "02"
title: "Installation and Configuration — klaster od zera"
chapter: 2
chapterTitle: "Installation and Configuration"
day: 1
environment: vagrant-kubeadm

intro: |
  Masz dwie maszyny z przygotowanym systemem i **żadnego klastra**. Zbudujesz go
  sam: `kubeadm init`, sieć, dołączenie worker node'a.

  ```bash
  cd env/vm/kubeadm
  vagrant ssh cp        # control plane node, 192.168.56.10
  vagrant ssh worker    # worker node,      192.168.56.11
  ```

  Całą pracę wykonujesz **na maszynach**. `kubectl` skonfigurujesz na `cp`
  i tam zostaje — na hoście nic się nie zmienia. Weryfikator sam łączy się
  z maszyną `cp`, więc dopóki nie ma na niej klastra (zadanie 1), wszystkie
  sprawdzenia są czerwone — i to jest poprawne.

tasks:
  - id: task-1
    points: 4
    description: |
      **Postaw control plane i skonfiguruj `kubectl`.**

      Na maszynie `cp` uruchom `kubeadm init` z pulą adresów Podów
      **`10.244.0.0/16`**, ogłaszając adres **`192.168.56.10`**.

      Potem skonfiguruj `kubectl` dla swojego użytkownika na `cp` — tak, żeby
      `kubectl get nodes` działało **bez `sudo`**. Z tego `kubectl` korzystasz
      w całym module.

      > Tę samą instalację da się opisać plikiem. Na `cp` leży gotowy
      > **`~/kubeadm-config.yaml`** z tymi samymi ustawieniami, co flagi wyżej —
      > zajrzyj do niego i wybierz jedną drogę:
      > `sudo kubeadm init --config ~/kubeadm-config.yaml`

      > Node będzie w stanie `NotReady`. To nie awaria — brakuje sieci Podów,
      > którą dołożysz w kolejnym zadaniu.
    hints:
      - "`kubeadm init` przyjmuje flagi `--pod-network-cidr` i `--apiserver-advertise-address`. Uruchom go przez `sudo`."
      - "Po udanym `init` kubeadm sam wypisuje trzy polecenia do skonfigurowania `kubectl` (`mkdir -p $HOME/.kube` …). Wykonaj je na maszynie `cp`."
      - "Kubeconfig administratora leży w `/etc/kubernetes/admin.conf` i czyta go tylko root. Skopiuj go do `~/.kube/config` i zmień właściciela na siebie — inaczej `kubectl` bez `sudo` dostanie `permission denied`."
    solution: |
      Na maszynie `cp`:

      ```bash
      sudo kubeadm init \
        --pod-network-cidr=10.244.0.0/16 \
        --apiserver-advertise-address=192.168.56.10

      # albo to samo z pliku:
      # sudo kubeadm init --config ~/kubeadm-config.yaml

      mkdir -p $HOME/.kube
      sudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
      sudo chown $(id -u):$(id -g) $HOME/.kube/config

      kubectl get nodes          # NotReady — tak ma być do zadania 2
      ```
    checks:
      - name: "na maszynie cp działa control plane"
        resource:
          apiVersion: v1
          kind: Node
          labelSelector: "node-role.kubernetes.io/control-plane"
        assert:
          - path: "{.items[*].metadata.name}"
            count:
              op: eq
              value: 1
            message: "spodziewam się dokładnie jednego control plane node'a — sprawdź `kubectl get nodes`"
      - name: "control plane node nazywa się k8s-cp"
        resource:
          apiVersion: v1
          kind: Node
          labelSelector: "node-role.kubernetes.io/control-plane"
        assert:
          - path: "{.items[*].metadata.name}"
            op: eq
            value: k8s-cp
            message: "nazwa node'a bierze się z hostname maszyny — powinno być `k8s-cp`"
      - name: "pula adresów Podów to 10.244.0.0/16"
        resource:
          apiVersion: v1
          kind: Node
          labelSelector: "node-role.kubernetes.io/control-plane"
        assert:
          - path: "{.items[*].spec.podCIDR}"
            op: contains
            value: "10.244."
            message: "podCIDR ustawia się flagą --pod-network-cidr przy `kubeadm init`; zmiana wymaga postawienia klastra od nowa"
      - name: "komponenty control plane działają jako static Pody"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: kube-system
          labelSelector: "tier=control-plane"
        assert:
          - path: "{.items[*].metadata.name}"
            count:
              op: gte
              value: 3
            message: "w kube-system powinny być Pody apiservera, schedulera i controller-managera"
      - name: "kubectl działa na cp bez sudo"
        exec:
          timeout: 2m
          script: |
            ILE=$(na-maszynie cp 'kubectl get nodes --no-headers 2>&1' | grep -c ' Ready\| NotReady')
            [ "$ILE" -ge 1 ] && echo "WYNIK: kubectl działa" \
              || echo "WYNIK: kubectl na cp nie widzi klastra — skopiuj admin.conf do ~/.kube/config i zmień właściciela"
          stdoutMatches: "WYNIK: kubectl działa"

  - id: task-2
    points: 3
    description: |
      **Dołóż sieć Podów.**

      Zainstaluj **Cilium** — narzędzie `cilium` jest już na maszynie `cp`.
      Po chwili node przejdzie w stan `Ready`, a Pody CoreDNS wyjdą z `Pending`.

      Jest jeden haczyk, o który łatwo się potknąć także na produkcji: Cilium
      **domyślnie nie przejmuje się** pulą podaną w `kubeadm init` —
      rozdaje adresy z własnej (`10.0.0.0/8`). Zadaniem jest zainstalować go
      tak, żeby trzymał się puli klastra `10.244.0.0/16`, czyli tej, którą
      controller-manager pociął na wycinki per node.

      Sprawdź po drodze, co mówi `kubectl describe node k8s-cp` **przed**
      instalacją sieci — komunikat o braku CNI plugina jest bardzo konkretny.
    hints:
      - "`cilium install` wystarczy, żeby CNI plugin wylądował w klastrze. Postęp pokazuje `cilium status --wait`."
      - "Tryb przydzielania adresów ustawia się wartością chartu: `--set ipam.mode=kubernetes`. Mówi ona Cilium, żeby brał wycinek z pola `spec.podCIDR` node'a, zamiast prowadzić własną pulę."
      - "Przypnij wersję, żeby wszystkim wyszło to samo: `--version 1.20.3`."
      - "Komplet:\n\n```bash\ncilium install --version 1.20.3 --set ipam.mode=kubernetes\ncilium status --wait\n```"
    solution: |
      Na maszynie `cp`:

      ```bash
      kubectl describe node k8s-cp | sed -n '/Conditions/,/Addresses/p'   # przed

      cilium install --version 1.20.3 --set ipam.mode=kubernetes
      cilium status --wait

      kubectl get nodes
      kubectl get pods -A -o wide
      ```

      Adresy Podów mają teraz wyjść z `10.244.x.x` — z wycinka przydzielonego
      node'owi, a nie z własnej puli Cilium.
    checks:
      - name: "control plane node jest w stanie Ready"
        resource:
          apiVersion: v1
          kind: Node
          labelSelector: "node-role.kubernetes.io/control-plane"
        assert:
          - path: "{.items[*].status.conditions[?(@.type=='Ready')].status}"
            op: eq
            value: "True"
            message: "node wciąż NotReady — `kubectl describe node` powie, czego brakuje"
      - name: "Pody CoreDNS działają"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: kube-system
          labelSelector: "k8s-app=kube-dns"
        assert:
          - path: "{.items[*].status.phase}"
            op: eq
            value: Running
            quantifier: all
            count:
              op: gte
              value: 1
            message: "CoreDNS zostaje w Pending, dopóki nie ma sieci Podów"
      - name: "działa CNI plugin (DaemonSet na każdym node'ie)"
        resource:
          apiVersion: apps/v1
          kind: DaemonSet
          allNamespaces: true
        assert:
          - path: "{.items[?(@.status.numberReady>0)].metadata.name}"
            op: matches
            value: "flannel|calico|cilium|weave|kube-router"
            quantifier: any
            message: "nie widzę działającego DaemonSetu z CNI pluginem"
      # Sedno zadania: bez `ipam.mode=kubernetes` Pody dostają adresy z puli
      # Cilium (10.0.0.0/8), a nie z wycinka node'a — klaster działa, ale pula
      # z `kubeadm init` jest ignorowana.
      - name: "Pody dostają adresy z puli podanej w kubeadm init"
        exec:
          timeout: 60s
          script: |
            K="kubectl --context ${KUBECONTEXT:-kubeadm-lfs458}"
            IP=$($K -n kube-system get pod -l k8s-app=kube-dns \
                   -o jsonpath='{.items[0].status.podIP}' 2>/dev/null)
            case "$IP" in
              10.244.*) echo "podIP=$IP (z puli klastra)" ;;
              "")       echo "nie ma jeszcze Poda CoreDNS z adresem" ;;
              *)        echo "podIP=$IP — to nie pula 10.244.0.0/16; sprawdź ipam.mode" ;;
            esac
          stdoutMatches: "z puli klastra"

  - id: task-3
    points: 4
    description: |
      **Dołącz worker node.**

      Na maszynie `cp` wygeneruj polecenie dołączenia, a potem uruchom je
      na maszynie `worker`. Klaster ma mieć **dwa node'y**, oba `Ready`.

      Zastanów się przy okazji: co dokładnie dostaje node, gdy „dołącza”?
      Odpowiedź jest w zadaniu 4.
    hints:
      - "Na `cp`: `kubeadm token create --print-join-command` wypisuje gotowe polecenie razem z tokenem i odciskiem CA."
      - "Polecenie `kubeadm join` uruchamiasz na maszynie `worker` przez `sudo`."
      - "Token żyje 24 godziny. Jeśli wygasł, wygeneruj nowy tym samym poleceniem."
      - "Komplet:\n\n```bash\n# na cp\nkubeadm token create --print-join-command\n# skopiuj wynik i na worker:\nsudo kubeadm join 192.168.56.10:6443 --token … --discovery-token-ca-cert-hash sha256:…\n```"
    solution: |
      ```bash
      # na maszynie cp
      JOIN=$(kubeadm token create --print-join-command)
      echo "$JOIN"

      # na maszynie worker
      sudo kubeadm join 192.168.56.10:6443 --token <token> \
        --discovery-token-ca-cert-hash sha256:<hash>
      ```
    checks:
      - name: "klaster ma dwa node'y"
        resource:
          apiVersion: v1
          kind: Node
        assert:
          - path: "{.items[*].metadata.name}"
            count:
              op: eq
              value: 2
            message: "spodziewam się dwóch node'ów: k8s-cp i k8s-worker"
      - name: "oba node'y są Ready"
        resource:
          apiVersion: v1
          kind: Node
        assert:
          - path: "{.items[*].status.conditions[?(@.type=='Ready')].status}"
            op: eq
            value: "True"
            quantifier: all
            message: "po dołączeniu node potrzebuje kilkudziesięciu sekund na start CNI — poczekaj i sprawdź ponownie"
      - name: "worker node nazywa się k8s-worker i nie ma roli control plane"
        resource:
          apiVersion: v1
          kind: Node
          name: k8s-worker
        assert:
          - path: "{.metadata.labels['node-role\\.kubernetes\\.io/control-plane']}"
            op: notExists
            message: "k8s-worker nie powinien mieć etykiety roli control plane"


  - id: task-4
    points: 4
    description: |
      **Przeczytaj, co kubeadm po sobie zostawił.**

      Cztery pytania o konfigurację, którą `kubeadm init` zapisał w klastrze
      i na dysku maszyny `cp`. Warianty pochodzą z Twojego klastra.

      Gdzie szukać — na maszynie `cp`:

      ```bash
      kubectl -n kube-system get cm kubeadm-config -o yaml
      kubectl -n kube-public get cm cluster-info -o yaml
      sudo grep staticPodPath /var/lib/kubelet/config.yaml
      sudo kubeadm certs check-expiration
      ```
    quiz:
      pytania:
        - pytanie: |
            Jaką pulę adresów **Podów** zapisał kubeadm w konfiguracji klastra?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kubeadm-lfs458}" -n kube-system get cm kubeadm-config \
                -o jsonpath='{.data.ClusterConfiguration}' | awk '/podSubnet:/ {print $2}'
          mylne: ["192.168.56.0/24", "10.0.0.0/8"]
          mylne_z:
            script: |
              kubectl --context "${KUBECONTEXT:-kubeadm-lfs458}" -n kube-system get cm kubeadm-config \
                -o jsonpath='{.data.ClusterConfiguration}' | awk '/serviceSubnet:/ {print $2}'
          wskazowka: "networking.podSubnet w `kubectl -n kube-system get cm kubeadm-config -o yaml`"

        - pytanie: |
            Pod jakim adresem i portem node'y widzą **serwer API**?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kubeadm-lfs458}" -n kube-public get cm cluster-info \
                -o jsonpath='{.data.kubeconfig}' | awk '/server:/ {print $2}' | sed 's|^https://||'
          mylne: ["10.96.0.1:443", "127.0.0.1:6443"]
          mylne_z:
            script: |
              E=$(kubectl --context "${KUBECONTEXT:-kubeadm-lfs458}" -n kube-public get cm cluster-info \
                    -o jsonpath='{.data.kubeconfig}' | awk '/server:/ {print $2}' | sed 's|^https://||')
              echo "${E%:*}:443"
          wskazowka: "pole server w ConfigMapie cluster-info w kube-public — ten sam adres podajesz w `kubeadm join`"

        - pytanie: |
            Z którego katalogu kubelet na maszynie `cp` czyta **static Pody**?
          odpowiedz:
            script: |
              K="kubectl --context ${KUBECONTEXT:-kubeadm-lfs458}"
              CP=$($K get nodes -l node-role.kubernetes.io/control-plane -o jsonpath='{.items[0].metadata.name}')
              $K get --raw "/api/v1/nodes/$CP/proxy/configz" | jq -r '.kubeletconfig.staticPodPath'
          mylne: ["/var/lib/kubelet/pods", "/etc/kubernetes/pki", "/etc/cni/net.d"]
          wskazowka: "na maszynie cp: sudo grep staticPodPath /var/lib/kubelet/config.yaml"

        - pytanie: |
            Kiedy wygasa certyfikat **CA** klastra (`RRRR-MM-DD`)?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kubeadm-lfs458}" -n default get cm kube-root-ca.crt \
                -o jsonpath='{.data.ca\.crt}' | openssl x509 -noout -enddate | cut -d= -f2 \
                | xargs -I{} date -u -d {} +%F
          mylne_z:
            script: |
              P=$(kubectl --context "${KUBECONTEXT:-kubeadm-lfs458}" -n default get cm kube-root-ca.crt \
                    -o jsonpath='{.data.ca\.crt}' | openssl x509 -noout -startdate | cut -d= -f2)
              date -u -d "$P +1 year" +%F
              date -u -d "$P +2 years" +%F
              date -u -d "$P +5 years" +%F
          wskazowka: "na maszynie cp: sudo kubeadm certs check-expiration — sekcja CERTIFICATE AUTHORITY, wiersz ca"

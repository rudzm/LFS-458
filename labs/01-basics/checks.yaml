module: "01"
title: "Basics of Kubernetes — pierwsze spojrzenie na klaster"
chapter: 1
chapterTitle: "Basics of Kubernetes"
day: 1
environment: kind-basic

# W tym module kursant jeszcze NICZEGO nie tworzy. Z wykładu zna dopiero
# strukturę klastra i reconciliation loop — Deploymenty, namespace'y i cała
# reszta modelu obiektowego to rozdziały 5 i 6. Dlatego wszystkie obiekty
# stawia tu `setup`, a zadania polegają na czytaniu klastra i obserwowaniu go.
setup:
  - name: "Wdrażam przykładową aplikację w namespace sklep-demo"
    timeout: 3m
    script: |
      K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
      $K create namespace sklep-demo --dry-run=client -o yaml | $K apply -f -
      $K create deployment kasa --image=nginx:1.27-alpine --replicas=1 \
        -n sklep-demo --dry-run=client -o yaml | $K apply -f -
      $K rollout status deployment/kasa -n sklep-demo --timeout=180s
  - name: "Wdrażam Deployment petla w namespace lfs458-m01"
    timeout: 3m
    script: |
      K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
      $K create namespace lfs458-m01 --dry-run=client -o yaml | $K apply -f -
      $K create deployment petla --image=nginx:1.27-alpine --replicas=2 \
        -n lfs458-m01 --dry-run=client -o yaml | $K apply -f -
      $K rollout status deployment/petla -n lfs458-m01 --timeout=180s

intro: |
  Klaster już stoi, a w nim działa kilka rzeczy, których nie uruchamiałeś.
  W tym labie nic nie budujesz — **czytasz klaster** i patrzysz, jak sam
  siebie naprawia.

  Większość punktów zdobywasz, odpowiadając na pytania o Twój klaster.
  Warianty odpowiedzi wyliczamy z niego na bieżąco, więc nie da się ich
  zgadnąć z pamięci — trzeba uruchomić polecenie.

  ```bash
  kubectl config use-context kind-lfs458
  kubectl get nodes
  ```

# `labctl cleanup 01` usuwa tylko to, co powstało w tym module. Klaster zostaje —
# używa go jeszcze jedenaście kolejnych modułów.
cleanup:
  - name: "Usuwam namespace sklep-demo"
    timeout: 3m
    ignoreError: true
    script: |
      kubectl --context "${KUBECONTEXT:-kind-lfs458}" delete namespace sklep-demo \
        --ignore-not-found --wait=true
  - name: "Usuwam namespace lfs458-m01 wraz z zawartością"
    timeout: 3m
    script: |
      kubectl --context "${KUBECONTEXT:-kind-lfs458}" delete namespace lfs458-m01 \
        --ignore-not-found --wait=true

tasks:
  # Pytania zamiast budowania: na tym etapie kursant zna z wykładu dwie role
  # maszyn i static Pody, więc pyta się o to, co widać w `kubectl get`.
  - id: task-1
    points: 4
    description: |
      **Rozejrzyj się po klastrze.**

      Pięć pytań o maszyny i o control plane. Każdej odpowiedzi szukasz
      `kubectl`-em — warianty pochodzą z Twojego klastra.

      > Przyda się `kubectl get nodes -o wide` i `kubectl get pods -n kube-system`.
    quiz:
      pytania:
        - pytanie: |
            Z ilu node'ów składa się ten klaster?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get nodes \
                --no-headers | wc -l | tr -d ' '
          mylne: ["1", "2", "5"]
          wskazowka: "kubectl get nodes"

        - pytanie: |
            Który node pełni rolę **control plane**?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get nodes \
                -l node-role.kubernetes.io/control-plane \
                -o jsonpath='{.items[0].metadata.name}'
          mylne_z:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get nodes \
                -o jsonpath='{.items[*].metadata.name}'
          wskazowka: "kolumna ROLES w `kubectl get nodes`"

        - pytanie: |
            Jaką wersję Kubernetesa raportują node'y?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get nodes \
                -o jsonpath='{.items[0].status.nodeInfo.kubeletVersion}'
          mylne: ["v1.36.0", "v1.35.4", "v1.38.1"]
          wskazowka: "kolumna VERSION w `kubectl get nodes` — to wersja kubeleta na node'ie"

        - pytanie: |
            Jak nazywa się Pod z **serwerem API** w namespace `kube-system`?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get pods -n kube-system \
                -l component=kube-apiserver -o jsonpath='{.items[0].metadata.name}'
          mylne_z:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get pods -n kube-system \
                -o jsonpath='{.items[*].metadata.name}'
          wskazowka: "kubectl get pods -n kube-system — nazwa static Poda kończy się nazwą node'a"

        - pytanie: |
            Obiekt jakiego **rodzaju** jest właścicielem (`ownerReferences`)
            tego Poda? Odpowiedź pokazuje, czym naprawdę jest static Pod.
          odpowiedz:
            script: |
              K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
              POD=$($K get pods -n kube-system -l component=kube-apiserver \
                      -o jsonpath='{.items[0].metadata.name}')
              $K get pod "$POD" -n kube-system \
                -o jsonpath='{.metadata.ownerReferences[0].kind}'
          mylne: ["ReplicaSet", "DaemonSet", "Deployment"]
          wskazowka: |
            kubectl get pod <nazwa> -n kube-system -o jsonpath='{.metadata.ownerReferences[0].kind}'

  - id: task-2
    points: 4
    description: |
      **Znajdź aplikację, której nie uruchamiałeś.**

      W klastrze działa namespace **`sklep-demo`**, a w nim Deployment
      `kasa`. Powstał razem ze środowiskiem tego laba. Cztery pytania o niego.

      > Nazwy Poda nie da się zgadnąć — ReplicaSet dokleja do niej losową
      > końcówkę. To właśnie dlatego Podów nie adresuje się po nazwie,
      > tylko po etykietach.
    quiz:
      pytania:
        - pytanie: |
            Jak dokładnie nazywa się Pod Deploymentu `kasa`?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get pods -n sklep-demo \
                -l app=kasa -o jsonpath='{.items[0].metadata.name}'
          mylne_z:
            script: |
              N=$(kubectl --context "${KUBECONTEXT:-kind-lfs458}" get pods -n sklep-demo \
                    -l app=kasa -o jsonpath='{.items[0].metadata.name}')
              BAZA="${N%-*}"
              for _ in 1 2 3; do
                echo "${BAZA}-$(tr -dc a-z0-9 </dev/urandom | head -c5)"
              done
          wskazowka: "kubectl get pods -n sklep-demo"

        - pytanie: |
            Z jakiego obrazu został uruchomiony ten Pod?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get pods -n sklep-demo \
                -l app=kasa -o jsonpath='{.items[0].spec.containers[0].image}'
          mylne: ["nginx:1.27", "nginx:latest", "nginx:1.26-alpine"]
          wskazowka: "kubectl get pods -n sklep-demo -o jsonpath='{.items[*].spec.containers[*].image}'"

        - pytanie: |
            Na którym node'ie wylądował ten Pod?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get pods -n sklep-demo \
                -l app=kasa -o jsonpath='{.items[0].spec.nodeName}'
          mylne_z:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get nodes \
                -o jsonpath='{.items[*].metadata.name}'
          wskazowka: "kolumna NODE w `kubectl get pods -n sklep-demo -o wide`"

        - pytanie: |
            Ile ReplicaSetów stoi w tej chwili między Deploymentem `kasa`
            a jego Podem?
          odpowiedz:
            script: |
              kubectl --context "${KUBECONTEXT:-kind-lfs458}" get rs -n sklep-demo \
                --no-headers 2>/dev/null | wc -l | tr -d ' '
          mylne: ["0", "2", "3"]
          wskazowka: "kubectl get rs -n sklep-demo"

  - id: task-3
    points: 4
    description: |
      **Zobacz reconciliation loop na żywo.**

      W namespace `lfs458-m01` działa Deployment `petla` — **2 repliki**
      `nginx:1.27-alpine`. Nikt nie pilnuje go ręcznie.

      1. Zobacz, co działa: `kubectl get pods -n lfs458-m01 -o wide`
      2. **Usuń jeden z Podów** i patrz, co się stanie:

      ```bash
      kubectl delete pod -n lfs458-m01 <nazwa-poda>
      kubectl get pods -n lfs458-m01 -w
      ```

      Zadanie jest zaliczone, gdy stan faktyczny **znów zgadza się**
      ze stanem docelowym — czyli gdy kontroler odtworzył to, co zniknęło.

      > Przyjrzyj się nazwie nowego Poda. Środkowy człon — hash ReplicaSetu —
      > jest ten sam. Odtworzeniem zajął się **ten sam ReplicaSet**,
      > a nie Deployment.
    hints:
      - "Nazwy Podów: `kubectl get pods -n lfs458-m01`. Usuwasz dowolny z dwóch."
      - "Nowy Pod wstaje w kilka sekund. Jeśli check jest czerwony, odczekaj chwilę — Pod może być jeszcze w stanie `ContainerCreating`."
      - "Podgląd na żywo przerywasz Ctrl+C: `kubectl get pods -n lfs458-m01 -w`."
      - "Komplet:\n\n```bash\nPOD=$(kubectl get pods -n lfs458-m01 -l app=petla -o jsonpath='{.items[0].metadata.name}')\nkubectl delete pod \"$POD\" -n lfs458-m01\nkubectl get pods -n lfs458-m01\n```"
    solution: |
      ```bash
      kubectl get pods -n lfs458-m01 -o wide

      POD=$(kubectl get pods -n lfs458-m01 -l app=petla \
        -o jsonpath='{.items[0].metadata.name}')
      kubectl delete pod "$POD" -n lfs458-m01

      kubectl get pods -n lfs458-m01 -w   # Ctrl+C, gdy znów będą dwa Ready
      ```

      Kolejność zdarzeń: `replicaset-controller` zauważa, że ma 1 Pod zamiast 2,
      tworzy nowy obiekt Pod bez `nodeName`; scheduler przypisuje mu node;
      kubelet na tym node'ie uruchamia kontener.
    checks:
      - name: "stan faktyczny dogonił docelowy (readyReplicas = spec.replicas)"
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: lfs458-m01
          name: petla
        assert:
          - path: "{.status.readyReplicas}"
            op: eq
            valuePath: "{.spec.replicas}"
            message: "nie wszystkie repliki są Ready — poczekaj chwilę (`kubectl get pods -n lfs458-m01`) i sprawdź ponownie"
      - name: "działają co najmniej 2 Pody, wszystkie w stanie Running"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: lfs458-m01
          labelSelector: "app=petla"
        assert:
          - path: "{.items[*].status.phase}"
            op: eq
            value: Running
            quantifier: all
            count:
              op: gte
              value: 2
            message: "mają działać minimum 2 Pody i wszystkie w stanie Running"
      - name: "odtworzeniem zajął się ten sam ReplicaSet"
        resource:
          apiVersion: apps/v1
          kind: ReplicaSet
          namespace: lfs458-m01
          labelSelector: "app=petla"
        assert:
          - path: "{.items[*].metadata.name}"
            count:
              op: eq
              value: 1
            message: "między Deploymentem a Podami zawsze stoi ReplicaSet — tu ma być dokładnie jeden (`kubectl get rs -n lfs458-m01`)"
      # Dwa niezależne ślady po usunięciu Poda: młodszy Pod niż jego ReplicaSet
      # albo trzecie zdarzenie SuccessfulCreate. Zdarzenia wygasają po godzinie,
      # znaczniki czasu nie — razem check nie zapala się na czerwono komuś,
      # kto zadanie zrobił, tylko wrócił do niego później.
      - name: "widać ślad odtworzenia Poda"
        exec:
          timeout: 40s
          script: |
            K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
            RS=$($K get rs -n lfs458-m01 -l app=petla \
                   -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -z "$RS" ]; then echo "WYNIK: brak ReplicaSetu petla"; exit 0; fi
            RS_T=$($K get rs "$RS" -n lfs458-m01 -o jsonpath='{.metadata.creationTimestamp}')
            POD_T=$($K get pods -n lfs458-m01 -l app=petla \
                      -o jsonpath='{.items[*].metadata.creationTimestamp}' \
                      | tr ' ' '\n' | sort | tail -1)
            ROZNICA=$(( $(date -d "$POD_T" +%s) - $(date -d "$RS_T" +%s) ))
            ILE=$($K get events -n lfs458-m01 --field-selector reason=SuccessfulCreate \
                    -o jsonpath='{.items[*].message}' 2>/dev/null \
                    | tr ' ' '\n' | grep -c "^${RS}-" 2>/dev/null)
            if [ "$ROZNICA" -ge 5 ] || [ "${ILE:-0}" -ge 3 ]; then
              echo "WYNIK: widac odtworzenie"
            else
              echo "WYNIK: wszystkie Pody sa z pierwszego rozruchu — usun jeden i poczekaj"
            fi
          stdoutMatches: "WYNIK: widac odtworzenie"

  - id: task-4
    points: 2
    optional: true
    description: |
      **Zmień stan docelowy.** *(zadanie dodatkowe — dla tych, którzy
      skończyli wcześniej)*

      Nie tworzysz nic nowego — mówisz klastrowi, że chcesz **4 repliki**
      zamiast dwóch, i patrzysz, jak sam dochodzi do tego stanu:

      ```bash
      kubectl scale deployment petla -n lfs458-m01 --replicas=4
      kubectl get pods -n lfs458-m01 -o wide
      ```

      Zwróć uwagę, na których node'ach wylądowały nowe Pody. Node wybrał
      **kube-scheduler** — kubelet tylko uruchomił kontenery.
    hints:
      - "Skalowanie to jedno polecenie: `kubectl scale deployment petla -n lfs458-m01 --replicas=4`."
      - "Rozmieszczenie zobaczysz w kolumnie NODE: `kubectl get pods -n lfs458-m01 -o wide`."
      - "Jeśli check jest czerwony, poczekaj, aż nowe Pody będą Ready: `kubectl rollout status deployment/petla -n lfs458-m01`."
    solution: |
      ```bash
      kubectl scale deployment petla -n lfs458-m01 --replicas=4
      kubectl rollout status deployment/petla -n lfs458-m01
      kubectl get pods -n lfs458-m01 -o wide
      ```
    checks:
      - name: "Deployment ma 4 gotowe repliki"
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: lfs458-m01
          name: petla
        assert:
          - path: "{.status.readyReplicas}"
            op: eq
            value: 4
            message: "przeskaluj do 4 replik i poczekaj, aż wszystkie będą Ready"
      - name: "działają 4 Pody w stanie Running"
        resource:
          apiVersion: v1
          kind: Pod
          namespace: lfs458-m01
          labelSelector: "app=petla"
        assert:
          - path: "{.items[*].status.phase}"
            op: eq
            value: Running
            quantifier: all
            count:
              op: eq
              value: 4
            message: "ma działać dokładnie 4 Pody i wszystkie w stanie Running"

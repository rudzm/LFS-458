module: "99"
title: "Capstone — wdrożenie produkcyjne od zera"
day: 4
environment: kind-basic

intro: |
  Zadanie podsumowujące całe szkolenie. Dostajesz **wymagania**, nie instrukcje.

  Firma wdraża usługę `api`. Twoim zadaniem jest przygotować dla niej
  środowisko produkcyjne spełniające standardy, o których mówiliśmy przez
  cztery dni: limity, konfigurację poza obrazem, zabezpieczone kontenery,
  rozproszenie replik, wejście z zewnątrz, izolację sieciową i możliwość
  bezpiecznego wydania nowej wersji.

  **Hinty są tu skąpsze niż w zwykłych labach** — pierwszy naprowadza,
  drugi podaje polecenie. Pełnych rozwiązań szukaj dopiero wtedy, gdy
  naprawdę utkniesz: to ćwiczenie ma przypominać egzamin, nie tutorial.

  Wszystko powstaje w namespace **`sklep-prod`**.

cleanup:
  - name: "Usuwam namespace sklep-prod"
    timeout: 5m
    script: |
      kubectl --context "${KUBECONTEXT:-kind-lfs458}" delete namespace sklep-prod --ignore-not-found --wait=true

tasks:
  - id: task-1
    points: 4
    description: |
      **Przygotuj namespace z ograniczeniami.**

      Utwórz namespace **`sklep-prod`**, a w nim:

      | Obiekt | Nazwa | Wymaganie |
      |---|---|---|
      | `ResourceQuota` | `limity` | najwyżej **10** Podów i **2Gi** pamięci w `requests` |
      | `LimitRange` | `domyslne` | domyślne `requests` dla kontenera: `100m` CPU i `128Mi` pamięci |

      Dzięki `LimitRange` Pody bez jawnych `requests` i tak je dostaną —
      a bez tego `ResourceQuota` odrzuciłaby je w całości.
    hints:
      - "Oba obiekty należą do grupy rdzeniowej. `kubectl explain resourcequota.spec` i `kubectl explain limitrange.spec.limits` podadzą nazwy pól."
      - "W `ResourceQuota` klucze to `pods` i `requests.memory`. W `LimitRange` potrzebujesz elementu z `type: Container` i sekcją `defaultRequest`."
    solution: |
      ```bash
      kubectl create namespace sklep-prod

      cat <<'EOF' | kubectl apply -f -
      apiVersion: v1
      kind: ResourceQuota
      metadata: {name: limity, namespace: sklep-prod}
      spec:
        hard:
          pods: "10"
          requests.memory: 2Gi
      ---
      apiVersion: v1
      kind: LimitRange
      metadata: {name: domyslne, namespace: sklep-prod}
      spec:
        limits:
          - type: Container
            defaultRequest:
              cpu: 100m
              memory: 128Mi
      EOF
      ```
    checks:
      - name: "namespace sklep-prod istnieje"
        resource:
          apiVersion: v1
          kind: Namespace
          name: sklep-prod
        assert:
          - path: "{.status.phase}"
            op: eq
            value: Active
      - name: "ResourceQuota ogranicza liczbę Podów i pamięć"
        resource:
          apiVersion: v1
          kind: ResourceQuota
          namespace: sklep-prod
          name: limity
        assert:
          - path: "{.spec.hard['pods']}"
            op: eq
            value: "10"
          - path: "{.spec.hard['requests\\.memory']}"
            op: eq
            value: "2Gi"
      - name: "LimitRange nadaje domyślne requests"
        resource:
          apiVersion: v1
          kind: LimitRange
          namespace: sklep-prod
          name: domyslne
        assert:
          - path: "{.spec.limits[?(@.type=='Container')].defaultRequest.cpu}"
            op: eq
            value: "100m"
          - path: "{.spec.limits[?(@.type=='Container')].defaultRequest.memory}"
            op: eq
            value: "128Mi"

  - id: task-2
    points: 4
    description: |
      **Konfiguracja, poświadczenia i ServiceAccount.**

      W `sklep-prod` utwórz:

      1. ConfigMapę **`api-config`** z kluczami `TRYB=produkcja`
         i `POZIOM_LOGOW=warn`
      2. Secret **`api-secret`** (typ `Opaque`) z kluczem `API_KLUCZ`
         o dowolnej wartości
      3. ServiceAccount **`api`**
      4. Role **`api-config-odczyt`** pozwalającą **wyłącznie** na `get`
         i `list` zasobu `configmaps`, oraz RoleBinding **`api`**
         wiążący ją z tym ServiceAccountem

      Konto ma móc czytać ConfigMapy i **nie może** czytać Secretów —
      mimo że sam Pod dostanie Secret jako zmienną środowiskową.
      To dwie różne drogi i warto rozumieć różnicę.
    hints:
      - "Wszystkie cztery obiekty da się utworzyć imperatywnie poleceniami `kubectl create`."
      - "`kubectl create role api-config-odczyt --verb=get,list --resource=configmaps -n sklep-prod`, a potem `kubectl create rolebinding api --role=api-config-odczyt --serviceaccount=sklep-prod:api -n sklep-prod`."
    solution: |
      ```bash
      kubectl create configmap api-config -n sklep-prod \
      kubectl create secret generic api-secret -n sklep-prod \
      kubectl create serviceaccount api -n sklep-prod
      kubectl create role api-config-odczyt --verb=get,list --resource=configmaps -n sklep-prod
      kubectl create rolebinding api --role=api-config-odczyt \
        --serviceaccount=sklep-prod:api -n sklep-prod
      ```
    checks:
      - name: "ConfigMapa i Secret zawierają wymagane klucze"
        resource:
          apiVersion: v1
          kind: ConfigMap
          namespace: sklep-prod
          name: api-config
        assert:
          - path: "{.data['TRYB']}"
            op: eq
            value: produkcja
          - path: "{.data['POZIOM_LOGOW']}"
            op: eq
            value: warn
      - name: "Secret api-secret istnieje"
        resource:
          apiVersion: v1
          kind: Secret
          namespace: sklep-prod
          name: api-secret
        assert:
          - path: "{.data['API_KLUCZ']}"
            op: exists
            message: "Secret ma zawierać klucz API_KLUCZ"
      - name: "ServiceAccount ma prawo czytać ConfigMapy i nie ma prawa do Secretów"
        exec:
          timeout: 60s
          script: |
            K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
            SA=system:serviceaccount:sklep-prod:api
            a=$($K auth can-i list configmaps --as=$SA -n sklep-prod)
            b=$($K auth can-i get secrets     --as=$SA -n sklep-prod)
            echo "configmaps=$a secrets=$b"
          stdoutMatches: "configmaps=yes secrets=no"

  - id: task-3
    points: 6
    description: |
      **Wdróż usługę zgodnie ze standardem produkcyjnym.**

      Deployment **`api`** w `sklep-prod`, spełniający **wszystkie** warunki:

      | Wymaganie | Szczegół |
      |---|---|
      | obraz | `hashicorp/http-echo:1.0`, argumenty `-text=api-v1` i `-listen=:5678` |
      | repliki | **2**, etykieta Podów `app=api` |
      | ServiceAccount | `api` |
      | konfiguracja | zmienna `TRYB` z ConfigMapy, `API_KLUCZ` z Secreta |
      | zasoby | `requests`: `50m` CPU, `64Mi` pamięci |
      | gotowość i życie | `readinessProbe` **i** `livenessProbe` — HTTP `GET /` na porcie `5678` |
      | bezpieczeństwo | `runAsNonRoot`, `runAsUser: 10001`, `allowPrivilegeEscalation: false`, `capabilities.drop: [ALL]` |
      | rozmieszczenie | repliki na **różnych node'ach** — przez **`preferred`** (`preferred`) |

      To jest sedno capstone'u — łączy moduły 06, 07, 10 i 14.

      > Dlaczego **`preferred`**, a nie `required`? Bo w zadaniu 6 wydasz nową
      > wersję ze strategią `maxSurge: 1`. Anti-affinity `required` przy dwóch
      > node'ach zakleszczyłaby ten rollout: nadmiarowa replika nie miałaby
      > gdzie stanąć. To jedna z najczęstszych pułapek produkcyjnych.
    hints:
      - "Zbieraj to kawałkami: najpierw działający Deployment z obrazem i replikami, potem kolejno zmienne, zasoby, probe'y, securityContext i affinity. Po każdym kroku `kubectl rollout status`."
      - "Jeśli Pody nie wstają po dodaniu `securityContext`, sprawdź `kubectl describe`. http-echo to statyczna binarka i działa jako dowolny UID, ale port musi być powyżej 1024 — stąd 5678."
      - "Anti-affinity `preferred`: `spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution` — lista, w której każdy element ma `weight` i `podAffinityTerm` z `topologyKey: kubernetes.io/hostname` oraz selektorem `app: api`."
    solution: |
      ```bash
      cat <<'EOF' | kubectl apply -f -
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: api, namespace: sklep-prod}
      spec:
        replicas: 2
        selector:
          matchLabels: {app: api}
        template:
          metadata:
            labels: {app: api}
          spec:
            serviceAccountName: api
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels: {app: api}
                      topologyKey: kubernetes.io/hostname
            containers:
              - name: api
                image: hashicorp/http-echo:1.0
                args: ["-text=api-v1", "-listen=:5678"]
                ports: [{name: http, containerPort: 5678}]
                env:
                  - name: TRYB
                    valueFrom: {configMapKeyRef: {name: api-config, key: TRYB}}
                  - name: API_KLUCZ
                    valueFrom: {secretKeyRef: {name: api-secret, key: API_KLUCZ}}
                resources:
                  requests: {cpu: 50m, memory: 64Mi}
                readinessProbe:
                  httpGet: {path: /, port: 5678}
                  initialDelaySeconds: 2
                livenessProbe:
                  httpGet: {path: /, port: 5678}
                  initialDelaySeconds: 5
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: ["ALL"]}
      EOF
      kubectl rollout status deployment/api -n sklep-prod
      ```
    checks:
      - name: "Deployment api ma 2 gotowe repliki na właściwym obrazie"
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: sklep-prod
          name: api
        assert:
          - path: "{.spec.replicas}"
            op: eq
            value: 2
          - path: "{.status.readyReplicas}"
            op: eq
            valuePath: "{.spec.replicas}"
            message: "poczekaj, aż obie repliki będą Ready"
          - path: "{.spec.template.spec.containers[*].image}"
            op: eq
            value: "hashicorp/http-echo:1.0"
      - name: "Pody używają ServiceAccountu api"
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: sklep-prod
          name: api
        assert:
          - path: "{.spec.template.spec.serviceAccountName}"
            op: eq
            value: api
      - name: "konfiguracja pochodzi z ConfigMapy i Secreta"
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: sklep-prod
          name: api
        assert:
          - path: "{.spec.template.spec.containers[*].env[*].valueFrom.configMapKeyRef.name}"
            op: eq
            value: api-config
            quantifier: any
          - path: "{.spec.template.spec.containers[*].env[*].valueFrom.secretKeyRef.name}"
            op: eq
            value: api-secret
            quantifier: any
      - name: "ustawiono zasoby, readinessProbe i livenessProbe"
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: sklep-prod
          name: api
        assert:
          - path: "{.spec.template.spec.containers[*].resources.requests.cpu}"
            op: eq
            value: "50m"
          - path: "{.spec.template.spec.containers[*].readinessProbe.httpGet.port}"
            op: eq
            value: 5678
          - path: "{.spec.template.spec.containers[*].livenessProbe.httpGet.port}"
            op: eq
            value: 5678
            message: "wymagane są `readinessProbe` i `livenessProbe`"
      - name: "kontener jest zabezpieczony"
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: sklep-prod
          name: api
        assert:
          - path: "{.spec.template.spec.securityContext.runAsNonRoot}"
            op: eq
            value: "true"
          - path: "{.spec.template.spec.containers[*].securityContext.allowPrivilegeEscalation}"
            op: eq
            value: "false"
          - path: "{.spec.template.spec.containers[*].securityContext.capabilities.drop[*]}"
            op: eq
            value: ALL
      - name: "rozproszenie zadeklarowano przez preferred"
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: sklep-prod
          name: api
        assert:
          - path: "{.spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[*].podAffinityTerm.topologyKey}"
            op: eq
            value: "kubernetes.io/hostname"
            message: "użyj preferredDuringSchedulingIgnoredDuringExecution — `required` zakleszczy rollout w zadaniu 6"
          - path: "{.spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution}"
            op: notExists
            message: "anti-affinity `required` przy dwóch node'ach uniemożliwi wdrożenie z maxSurge: 1"
      - name: "repliki stoją na różnych node'ach"
        exec:
          timeout: 60s
          script: |
            K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
            n=$($K get pods -n sklep-prod -l app=api \
                  -o jsonpath='{.items[*].spec.nodeName}' \
                | tr ' ' '\n' | grep -v '^$' | sort -u | wc -l | tr -d ' ')
            echo "roznych-nodow=$n"
          stdoutMatches: "roznych-nodow=2"

  - id: task-4
    points: 5
    description: |
      **Wystaw usługę na zewnątrz.**

      1. Service **`api`** typu `ClusterIP`, port `80` → `targetPort` `5678`,
         selektor `app=api`
      2. Ingress **`api`** klasy `nginx`, host **`sklep.lfs458.local`**,
         ścieżka `/` → usługa `api` port `80`

      Sprawdzenie z hosta:

      ```bash
      curl -s -H 'Host: sklep.lfs458.local' http://localhost:8080/
      ```
    hints:
      - "Service najszybciej: `kubectl expose deployment api --port=80 --target-port=5678 -n sklep-prod`."
      - "W Ingressie pamiętaj o `ingressClassName: nginx` — bez tego żaden kontroler nie weźmie obiektu, a kolumna ADDRESS zostanie pusta."
    solution: |
      ```bash
      kubectl expose deployment api --port=80 --target-port=5678 -n sklep-prod

      cat <<'EOF' | kubectl apply -f -
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: {name: api, namespace: sklep-prod}
      spec:
        ingressClassName: nginx
        rules:
          - host: sklep.lfs458.local
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend: {service: {name: api, port: {number: 80}}}
      EOF
      ```
    checks:
      - name: "Service api ma dwa backendy"
        resource:
          apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          namespace: sklep-prod
          labelSelector: "kubernetes.io/service-name=api"
        assert:
          - path: "{.items[*].endpoints[*].addresses[*]}"
            count:
              op: eq
              value: 2
            message: "brak backendów oznacza, że selektor Service'u nie pasuje do etykiet Podów"
      - name: "Ingress kieruje host sklep.lfs458.local do usługi api"
        resource:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          namespace: sklep-prod
          name: api
        assert:
          - path: "{.spec.ingressClassName}"
            op: eq
            value: nginx
          - path: "{.spec.rules[*].host}"
            op: eq
            value: "sklep.lfs458.local"
      - name: "usługa odpowiada z zewnątrz przez Ingress"
        http:
          url: "http://localhost:8080/"
          host: "sklep.lfs458.local"
          expectStatus: 200
          # Nie przybijamy wersji: zadanie 6 podmienia ja na api-v2.
          bodyMatches: "^api-v[0-9]"
          timeout: 20s

  - id: task-5
    points: 5
    description: |
      **Odetnij usługę od reszty klastra.**

      Do `api` ma docierać ruch **wyłącznie** od kontrolera Ingress.
      Żaden inny Pod w klastrze nie może się do niego dodzwonić.

      1. Utwórz w `sklep-prod` NetworkPolicy **`api-tylko-ingress`**,
         która dopuszcza ruch przychodzący do Podów `app=api` **tylko**
         z namespace'u kontrolera Ingress
      2. Uruchom w `sklep-prod` Pod **`obcy`** (`busybox:1.36`, `sleep 3600`)
         bez etykiety `app=api` i **sprawdź**, że nie dosięga usługi

      Ruch przez Ingress ma nadal działać — sprawdzenie z zadania 4
      musi zostać zielone.
    hints:
      - "Kontroler Ingress działa w namespace `ingress-nginx`. Namespace'y da się wybierać etykietą `kubernetes.io/metadata.name`, którą Kubernetes nadaje każdemu automatycznie."
      - "```yaml\ningress:\n  - from:\n      - namespaceSelector:\n          matchLabels:\n            kubernetes.io/metadata.name: ingress-nginx\n```"
    solution: |
      ```bash
      cat <<'EOF' | kubectl apply -f -
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: api-tylko-ingress, namespace: sklep-prod}
      spec:
        podSelector:
          matchLabels: {app: api}
        policyTypes: [Ingress]
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: ingress-nginx
            ports:
              - protocol: TCP
                port: 5678
      ---
      apiVersion: v1
      kind: Pod
      metadata: {name: obcy, namespace: sklep-prod}
      spec:
        containers:
          - {name: c, image: "busybox:1.36", command: ["sleep","3600"]}
      EOF

      kubectl exec -n sklep-prod obcy -- wget -qO- --timeout=5 http://api || \
        echo "zablokowany — tak ma być"
      ```
    checks:
      - name: "polityka chroni Pody api i wpuszcza kontroler Ingress"
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          namespace: sklep-prod
          name: api-tylko-ingress
        assert:
          - path: "{.spec.podSelector.matchLabels['app']}"
            op: eq
            value: api
          - path: "{.spec.ingress[*].from[*].namespaceSelector.matchLabels['kubernetes\\.io/metadata\\.name']}"
            op: eq
            value: ingress-nginx
            message: "wpuść ruch z namespace'u kontrolera Ingress przez namespaceSelector"
      - name: "obcy Pod nie dosięga usługi"
        exec:
          timeout: 90s
          script: |
            K="kubectl --context ${KUBECONTEXT:-kind-lfs458}"
            if $K exec -n sklep-prod obcy -- wget -qO- --timeout=6 http://api >/dev/null 2>&1; then
              echo "WYNIK: obcy przeszedł — polityka nie działa"
            else
              echo "WYNIK: obcy zablokowany"
            fi
          stdoutMatches: "WYNIK: obcy zablokowany"
      - name: "ruch przez Ingress nadal działa"
        http:
          url: "http://localhost:8080/"
          host: "sklep.lfs458.local"
          expectStatus: 200
          # Nie przybijamy wersji: zadanie 6 podmienia ja na api-v2.
          bodyMatches: "^api-v[0-9]"
          timeout: 20s

  - id: task-6
    points: 4
    description: |
      **Wydaj nową wersję bezpiecznie.**

      1. Zabezpiecz usługę **PodDisruptionBudgetem** `api-pdb` —
         zawsze ma działać co najmniej **1** replika
      2. Wydaj wersję **`api-v2`**: zmień argument `-text` na `api-v2`
         i zapisz powód zmiany w adnotacji `kubernetes.io/change-cause`
      3. Ustaw strategię tak, żeby wdrożenie **nie zabierało** żadnej repliki:
         `maxUnavailable: 0`, `maxSurge: 1`

      > Ta strategia działa tylko dlatego, że rozproszenie z zadania 3 jest
      > **`preferred`**. Gdyby było `required`, nadmiarowa replika nie miałaby wolnego
      > node'a i rollout stanąłby na zawsze — z komunikatem
      > `1 out of 2 new replicas have been updated`.

      Po wszystkim Ingress ma zwracać `api-v2`.
    hints:
      - "PDB jest w grupie `policy/v1`; jego `selector` musi pasować do etykiet Podów (`app: api`)."
      - "Argumenty kontenera zmienisz przez `kubectl edit` albo `kubectl patch ... --type=strategic` z pełną listą `args`. Pamiętaj o adnotacji `change-cause` — `set image` jej nie doda za Ciebie."
    solution: |
      ```bash
      cat <<'EOF' | kubectl apply -f -
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata: {name: api-pdb, namespace: sklep-prod}
      spec:
        minAvailable: 1
        selector:
          matchLabels: {app: api}
      EOF

      kubectl patch deployment api -n sklep-prod --type=strategic -p '{
        "spec": {
          "strategy": {"type":"RollingUpdate","rollingUpdate":{"maxUnavailable":0,"maxSurge":1}},
          "template": {"spec": {"containers": [
            {"name":"api","args":["-text=api-v2","-listen=:5678"]}]}}
        }}'

      kubectl annotate deployment api -n sklep-prod --overwrite \
        kubernetes.io/change-cause='wydanie api-v2'
      kubectl rollout status deployment/api -n sklep-prod
      ```
    checks:
      - name: "PodDisruptionBudget chroni co najmniej jedną replikę"
        resource:
          apiVersion: policy/v1
          kind: PodDisruptionBudget
          namespace: sklep-prod
          name: api-pdb
        assert:
          - path: "{.spec.minAvailable}"
            op: eq
            value: 1
          - path: "{.status.currentHealthy}"
            op: gte
            value: 1
            message: "PDB nie widzi Podów — sprawdź, czy selektor pasuje do etykiety app=api"
      - name: "strategia nie zabiera replik w trakcie wdrożenia"
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: sklep-prod
          name: api
        assert:
          - path: "{.spec.strategy.rollingUpdate.maxUnavailable}"
            op: eq
            value: 0
          - path: "{.spec.strategy.rollingUpdate.maxSurge}"
            op: eq
            value: 1
      - name: "zapisano powód zmiany i wydano nową wersję"
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: sklep-prod
          name: api
        assert:
          - path: "{.metadata.annotations['kubernetes\\.io/change-cause']}"
            op: matches
            value: "^.{5,}$"
          - path: "{.metadata.annotations['deployment\\.kubernetes\\.io/revision']}"
            op: gte
            value: 2
      - name: "usługa serwuje nową wersję przez Ingress"
        http:
          url: "http://localhost:8080/"
          host: "sklep.lfs458.local"
          expectStatus: 200
          bodyMatches: "api-v2"
          timeout: 20s

  - id: task-7
    points: 4
    optional: true
    description: |
      **Dołóż warstwę danych.**

      Zadanie dodatkowe dla tych, którzy skończyli wcześniej.

      1. PVC **`api-dane`** — `100Mi`, `ReadWriteOnce`, klasa `standard`
      2. Deployment **`baza`** — 1 replika `busybox:1.36`, montuje ten PVC
         pod `/dane` i przy starcie zapisuje tam plik `init.txt`
         z tekstem `capstone`
      3. Udowodnij trwałość: usuń Pod bazy i sprawdź, że po odtworzeniu
         plik nadal tam jest

      > Pamiętaj o `ResourceQuota` z zadania 1 — masz limit 10 Podów
      > i 2Gi pamięci w `requests` na cały namespace.
    hints:
      - "Deployment z PVC w trybie ReadWriteOnce może mieć tylko jedną replikę — przy większej liczbie kolejne Pody utkną w Pending, jeśli trafią na inne node'y."
      - "Polecenie kontenera: `[\"sh\",\"-c\",\"[ -f /dane/init.txt ] || echo capstone > /dane/init.txt; sleep 3600\"]` — zapisuje plik tylko, jeśli go jeszcze nie ma. Dzięki temu drugi start niczego nie nadpisze i naprawdę sprawdzasz trwałość."
    solution: |
      ```bash
      cat <<'EOF' | kubectl apply -f -
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: {name: api-dane, namespace: sklep-prod}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources: {requests: {storage: 100Mi}}
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: baza, namespace: sklep-prod}
      spec:
        replicas: 1
        selector: {matchLabels: {app: baza}}
        template:
          metadata: {labels: {app: baza}}
          spec:
            volumes:
              - name: dane
                persistentVolumeClaim: {claimName: api-dane}
            containers:
              - name: baza
                image: busybox:1.36
                command: ["sh","-c","[ -f /dane/init.txt ] || echo capstone > /dane/init.txt; sleep 3600"]
                volumeMounts:
                  - {name: dane, mountPath: /dane}
      EOF

      kubectl rollout status deployment/baza -n sklep-prod
      kubectl delete pod -n sklep-prod -l app=baza
      kubectl rollout status deployment/baza -n sklep-prod
      kubectl exec -n sklep-prod deploy/baza -- cat /dane/init.txt
      ```
    checks:
      - name: "PVC api-dane jest związany"
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          namespace: sklep-prod
          name: api-dane
        assert:
          - path: "{.status.phase}"
            op: eq
            value: Bound
          - path: "{.spec.resources.requests.storage}"
            op: eq
            value: "100Mi"
      - name: "Deployment baza montuje PVC i działa"
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: sklep-prod
          name: baza
        assert:
          - path: "{.status.readyReplicas}"
            op: eq
            value: 1
          - path: "{.spec.template.spec.volumes[*].persistentVolumeClaim.claimName}"
            op: eq
            value: api-dane
      - name: "dane przetrwały odtworzenie Poda"
        exec:
          timeout: 90s
          script: |
            kubectl --context "${KUBECONTEXT:-kind-lfs458}" exec -n sklep-prod \
              deploy/baza -- cat /dane/init.txt
          stdoutMatches: "capstone"
